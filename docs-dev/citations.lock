# 格式 (每条两行):
#   <被引文件>:<行范围>  <SHA-256 前12位>  lines=<行数>
#     <- <引用它的文档位置>, ...  :: <被引范围内首个非空行的前 60 字符>
#
# 摘要算法: 取该行范围, 逐行去掉首尾空白, 用换行连接, 取 SHA-256 前 12 位。
# (纯缩进调整不报警; 任何实质内容变化都会变哈希。)
#
# 默认模式只校验、不写这个文件。要接受一次真实变化, 显式跑:
#   python3 scripts/check-citation-drift.py --update

