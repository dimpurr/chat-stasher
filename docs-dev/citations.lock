# docs-dev/citations.lock — 文档出处引用的内容锚点
#
# 由 scripts/check-citation-drift.py 生成。每条引用记录的是【被引行的内容摘要】,
# 不是行号是否越界 —— 代码被编辑后行号还在、内容已经不是当初那段, 就是这里要抓的漂移。
