# Release — build the installable binary and attach it to the tagged Release.
#
# Runs ONLY when a version tag (`v*`) is pushed. A release is an event — the
# tag — not a manual toggle, so there is no workflow_dispatch here. `v*` is
# wider than "a release tag", so the tag's shape is the first thing checked
# below: a tag that is not `vX.Y.Z` or `vX.Y.Z-rc.N` fails the run before
# anything is built.
#
# The workflow builds prebuilt binaries for supported macOS platforms
# (darwin-arm64 and darwin-x86_64) and bundles a single SHA256SUMS covering both.
# Gates run once before building to ensure only verified code is released.
name: Release

on:
  push:
    tags:
      - 'v*'

# A tag pushed twice in a row cancels its own earlier run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Only the auto-generated GITHUB_TOKEN is used (no stored secrets). Writing
  # the Release and uploading assets to it needs contents: write.
  contents: write

jobs:
  build-and-release:
    name: build + release (macOS arm64 + x86_64)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust with arm64 and x86_64 targets
        # Mirrors .github/workflows/ci.yml:109 (dtolnay/rust-toolchain@stable).
        # Adds both aarch64-apple-darwin and x86_64-apple-darwin targets.
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      # -----------------------------------------------------------------------
      # FIRST gate, because the tag is the release's whole identity and because
      # a wrong tag is the one failure nothing downstream can notice.
      #
      # Exactly two tag shapes are release tags (RELEASING.md, "Channels"):
      #
      #   v0.3.0        a stable release  -> published as the repository's "latest"
      #   v0.3.0-rc.1   a candidate       -> published as a GitHub *prerelease*
      #
      # The trigger above is `v*`, which is wider: `v0.3.0rc1`, `v0.3.0-rc` and
      # `v0.3.0-beta.1` all match it too. Each is a plausible typo for a tag
      # someone meant, and under the previous "does the version contain a
      # hyphen?" rule the first published as a *normal* release and took the
      # "latest" slot — which is what a reader of the Releases page means by
      # stable — and the other two published as prereleases. So the shape is asserted here, before the gates and
      # before the build, and a tag that is not one of the two ends the run.
      #
      # The tag must also name the exact version Cargo.toml carries, for both
      # shapes. The binary embeds CARGO_PKG_VERSION (built below; RELEASING.md
      # step 7 checks `chat-stasher --version`), so a tag that disagrees with
      # Cargo.toml ships a Release titled after the tag whose binary reports the
      # other string. For an rc the disagreement is worse than cosmetic: an rc
      # and the stable it is a candidate for would then print the same version,
      # which is why the rc carries its `-rc.N` suffix in Cargo.toml too.
      - name: Gate — tag shape and version agreement
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            KIND="stable"
            PRERELEASE=0
          elif printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            KIND="release candidate"
            PRERELEASE=1
          else
            {
              echo "error: '${TAG}' is not a release tag."
              echo "       a release tag is exactly one of:"
              echo "         vMAJOR.MINOR.PATCH        a stable release"
              echo "         vMAJOR.MINOR.PATCH-rc.N   a release candidate"
              echo "       Nothing was built and nothing was published by this run."
            } >&2
            exit 1
          fi

          VERSION="${TAG#v}"

          # The `[package]` version, which is the string CARGO_PKG_VERSION gets.
          # Scoped to the `[package]` table so a `version =` under
          # `[dependencies]` can never be the one that answers.
          CARGO_VERSION="$(awk '
            /^\[/ { section = $0 }
            section == "[package]" && /^version[ ]*=/ {
              line = $0
              sub(/^[^"]*"/, "", line)
              sub(/".*$/, "", line)
              print line
              exit
            }
          ' crates/chat-stasher/Cargo.toml)"

          if [ -z "$CARGO_VERSION" ]; then
            echo "error: no version found under [package] in crates/chat-stasher/Cargo.toml" >&2
            exit 1
          fi

          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            {
              echo "error: the tag and Cargo.toml disagree."
              echo "       tag:                             ${TAG} -> ${VERSION} (${KIND})"
              echo "       crates/chat-stasher/Cargo.toml:  ${CARGO_VERSION}"
              echo "       The binary embeds the Cargo.toml version, so this Release"
              echo "       would ship a binary reporting '${CARGO_VERSION}'."
              echo "       Set Cargo.toml (and Cargo.lock) on main first — RELEASING.md."
            } >&2
            exit 1
          fi

          echo "tag OK: ${TAG} — ${KIND}; Cargo.toml agrees at ${CARGO_VERSION}"

          # Read by the create step, so the two places that need to know the
          # shape cannot disagree about what the shapes are.
          echo "RELEASE_PRERELEASE=${PRERELEASE}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # Verify BEFORE building anything that could be published.
      #
      # 🔴 2026-08-29 — v0.1.0 shipped with its own release gate failing. The
      # tag triggered two workflows that knew nothing about each other: CI ran
      # the gate on macOS and its "Run release gate" step failed, while this
      # workflow built and published regardless. GitHub Actions has no way for
      # one workflow to depend on another (`needs:` is within-workflow only),
      # so "CI will catch it" was never true — it was an assumption with no
      # mechanism behind it.
      #
      # The fix is not more discipline. It is that the workflow which publishes
      # must itself verify what it publishes, rather than trusting a sibling.
      # These steps run before the build so a failure costs seconds, not a
      # cross-compile.
      - name: Gate — semantic defaults (unknown must not become a value)
        run: python3 scripts/check-semantic-defaults.py

      - name: Gate — terminology consistency
        run: python3 scripts/check-terminology.py

      - name: Gate — citation anchors
        run: python3 scripts/check-citation-drift.py

      - name: Gate — output inventory
        run: python3 scripts/output-inventory.py --check

      # One line: the script provides its own fixture and builds the debug
      # binary it needs. Previously three steps duplicated from ci.yml, with a
      # comment admitting the two copies would drift. They no longer exist.
      - name: Gate — full release gate
        run: bash scripts/release-gate.sh

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 23.10.0
          cache: pnpm
          cache-dependency-path: apps/extension/pnpm-lock.yaml

      - name: Install extension dependencies
        working-directory: apps/extension
        run: pnpm install --frozen-lockfile

      - name: Build stable extension zip
        working-directory: apps/extension
        run: |
          set -euo pipefail
          unset CS_RELEASE_CHANNEL
          pnpm zip

      - name: Build release binaries (aarch64 + x86_64)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Stage artifacts (binaries + stable extension + SHA256SUMS)
        run: |
          set -euo pipefail

          # The artifact names follow the install.sh contract, byte for byte
          # (scripts/install.sh):
          #   TARGET   = "$(uname -s)-$(uname -m)" → darwin-arm64, darwin-x86_64
          #   ARTIFACT = "chat-stasher-${TARGET}"
          ARTIFACT_ARM64="chat-stasher-darwin-arm64"
          ARTIFACT_X86="chat-stasher-darwin-x86_64"
          EXT_VERSION="$(node -p "require('./apps/extension/package.json').version")"
          EXT_ASSET="chat-stasher-extension-${EXT_VERSION}.zip"

          mkdir -p dist
          cp "target/aarch64-apple-darwin/release/chat-stasher" "dist/$ARTIFACT_ARM64"
          cp "target/x86_64-apple-darwin/release/chat-stasher" "dist/$ARTIFACT_X86"
          EXT_ZIP="$(find apps/extension/.output -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$EXT_ZIP" ]; then
            echo "error: extension zip was not produced" >&2
            exit 1
          fi
          cp "$EXT_ZIP" "dist/$EXT_ASSET"

          # The stable extension manifest must not include experimental origins.
          unzip -p "dist/$EXT_ASSET" manifest.json | python3 -c '
          import json, sys
          manifest = json.load(sys.stdin)
          serialized = json.dumps(manifest).lower()
          forbidden = [origin for origin in ("perplexity.ai", "kimi.com") if origin in serialized]
          if forbidden:
              raise SystemExit("error: stable extension manifest includes experimental origins: " + ", ".join(forbidden))
          print("stable extension manifest OK: no experimental origins")
          '

          # Guard against a mislabeled binary: assert each Mach-O is really its architecture
          file "dist/$ARTIFACT_ARM64" | grep -q 'arm64' || {
            echo "error: built binary is not arm64:" >&2
            file "dist/$ARTIFACT_ARM64" >&2
            exit 1
          }
          file "dist/$ARTIFACT_X86" | grep -q 'x86_64' || {
            echo "error: built binary is not x86_64:" >&2
            file "dist/$ARTIFACT_X86" >&2
            exit 1
          }

          # SHA256SUMS must parse under install.sh's exact rule
          # `awk -v a="$ARTIFACT" '$2 == a { print $1 }'` (install.sh:80), i.e.
          # one "<hex>  <filename>" line per asset. `shasum -a 256` emits the
          # same two-space separator release-artifacts.sh produces locally
          # (scripts/release-artifacts.sh:52).
          ( cd dist && shasum -a 256 "$ARTIFACT_ARM64" "$ARTIFACT_X86" "$EXT_ASSET" > SHA256SUMS )

          # Self-check with install.sh's own awk: the digest for each artifact
          # must be present, or installs would hard-fail at install.sh:81-84.
          for art in "$ARTIFACT_ARM64" "$ARTIFACT_X86" "$EXT_ASSET"; do
            EXPECTED="$(awk -v a="$art" '$2 == a { print $1 }' dist/SHA256SUMS)"
            [ -n "$EXPECTED" ] || {
              echo "error: SHA256SUMS has no entry for '${art}'" >&2
              exit 1
            }
          done

          echo "staged:"
          ls -l dist
          cat dist/SHA256SUMS

          # The extension joins stable releases only as a stable-channel zip.
          # Keep the uploaded set closed so a dev-channel build or stray file
          # cannot become an unreviewed release asset.
          expected="$(printf '%s\n' "$ARTIFACT_ARM64" "$ARTIFACT_X86" "$EXT_ASSET" SHA256SUMS | sort)"
          actual="$(ls dist | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "error: unexpected release assets in dist/ — expected exactly:" >&2
            printf '%s\n' "$expected" >&2
            echo "got:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          echo "asset set OK: CLI binaries + stable extension zip + SHA256SUMS"
      - name: Create Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The tag is "v0.1.0"; install.sh fetches from
          # https://github.com/dimpurr/chat-stasher/releases/download/v${VERSION}
          # (install.sh:22), so the Release tag and asset names must match the
          # tag exactly — nothing is renamed here.
          TAG="$GITHUB_REF_NAME"    # e.g. v0.2.0 | v0.3.0-rc.1
          VERSION="${TAG#v}"        # e.g. 0.2.0 | 0.3.0-rc.1

          # --- stable vs release candidate ----------------------------------
          # The shape was decided once, by the "Gate — tag shape and version
          # agreement" step, which is the only place that knows what the two
          # shapes are; this step reads its answer rather than re-deriving it
          # from the string, so the two steps cannot drift apart.
          #
          # The prerelease flag is the whole mechanism that keeps an rc from
          # becoming the repository's "latest" release, and "latest" is what a
          # reader of the Releases page means by stable. Without it an rc would
          # take the latest slot and quietly become what people install.
          # "Drafts and prereleases cannot be set as latest." —
          # https://docs.github.com/en/rest/releases/releases (read 2026-09-23)
          #
          # An unset value is NOT read as "stable": that would be the gate
          # failing open, publishing an unverified tag as the latest release.
          # It means this job reached here without the gate, and the tag was
          # never checked.
          #
          # `${RC_FLAG:+--prerelease}` rather than a bare `$RC_FLAG`: it expands
          # to nothing when the variable is empty, so a stable tag runs the
          # exact command a stable tag ran before this branch existed.
          case "${RELEASE_PRERELEASE:-}" in
            0) RC_FLAG="" ;;
            1) RC_FLAG=1 ;;
            *)
              echo "error: RELEASE_PRERELEASE is '${RELEASE_PRERELEASE:-<unset>}', not 0 or 1 — the tag-shape gate did not run, so '${TAG}' was never verified. Refusing to publish." >&2
              exit 1
              ;;
          esac

          # The staged set, already asserted in the "Stage artifacts" step to be
          # exactly four files. This is the set the Release must end up with.
          expected_assets="$(cd dist && ls -1 | sort)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; reconciling its asset set."
            # 🔴 A re-run must not fail on an existing asset, and must not grow
            # the published set. `gh release upload --clobber` replaces a
            # same-named asset but leaves any *other* asset in place, so a
            # mistakenly attached file (or one from an earlier draft) would
            # survive every re-run and the Release would carry more than the
            # build produced. Remove every existing asset this run does not
            # stage, then upload.
            existing_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              if printf '%s\n' "$expected_assets" | grep -qxF -- "$name"; then
                continue
              fi
              echo "removing stale release asset: ${name}"
              gh release delete-asset "$TAG" "$name" --yes
            done <<< "$existing_assets"

            gh release upload "$TAG" dist/* --clobber
          else
            echo "Creating Release ${TAG}${RC_FLAG:+ (prerelease)}."
            gh release create "$TAG" dist/* \
              ${RC_FLAG:+--prerelease} \
              --title "chat-stasher v${VERSION}" \
              --notes "Prebuilt macOS CLI binaries, the stable browser extension zip, and SHA256SUMS. See docs/install.md for installation."
          fi

          # 🔴 The published set must equal the staged set, exactly — the same
          # four names the "Stage artifacts" step asserted in `dist/`. Checking
          # the *result* rather than trusting the commands is what turns a
          # partial upload (a `--clobber` that lost an asset, a delete that did
          # not happen) into a red run instead of a Release that quietly
          # differs from what was built.
          published_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          if [ "$published_assets" != "$expected_assets" ]; then
            {
              echo "error: the published asset set does not match dist/."
              echo "       expected:"
              printf '%s\n' "$expected_assets"
              echo "       published:"
              printf '%s\n' "$published_assets"
            } >&2
            exit 1
          fi
          echo "published asset set OK:"
          printf '%s\n' "$published_assets"
