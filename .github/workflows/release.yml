# Release — build the installable binaries and attach them to the tagged Release.
#
# Runs when a version tag (`v*`) is pushed, or manually for a registry publish
# retry or dry run. The manual trigger takes a *tag* and nothing else: the first
# gate ends a run against any other ref, because `workflow_dispatch` also offers
# a branch and a branch may be named exactly like a release tag. `v*` is wider
# than "a release tag" as well, so the tag's shape is checked in that same gate:
# a tag that is not `vX.Y.Z` or `vX.Y.Z-rc.N` fails the run before anything is
# built. That gate is scripts/release-tag-gate.sh, which is also what decides
# the npm dist-tag the registry job publishes under.
#
# The workflow builds one prebuilt binary per supported platform, each on a
# runner whose architecture is the binary's architecture (no cross-emulation,
# no qemu):
#
#   chat-stasher-darwin-arm64          macos-latest (arm64), native
#   chat-stasher-darwin-x86_64         macos-latest (arm64), cross-built for x86_64
#   chat-stasher-linux-x86_64          ubuntu-24.04      (x86_64), musl, static
#   chat-stasher-linux-arm64           ubuntu-24.04-arm  (arm64),  musl, static
#   chat-stasher-windows-x86_64.exe    windows-latest    (x86_64)
#
# plus the stable browser-extension zip, and bundles a single SHA256SUMS
# covering all of them.
#
# The two macOS binaries come out of one job because one macOS runner can build
# both, and a macOS runner is the most expensive of the three by an order of
# magnitude (the arithmetic is at the top of .github/workflows/ci.yml). The
# Linux builds are one job per architecture rather than one job cross-compiling
# both, because a static musl build compiles its C dependencies (aws-lc,
# sqlite3, zstd) for the target, and having the target's own compiler is what
# makes that a build rather than a guess.
#
# Gates run once, in their own job, before any build starts, and every build
# job depends on it. The tag is the release's whole identity, so the gates are
# the first thing that can end a run.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate npm and crates.io packages without publishing'
        required: true
        type: boolean
        default: true

# A tag pushed twice in a row cancels its own earlier run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # The workflow-wide grant is `contents: write` because the `release` job uses
  # the auto-generated GITHUB_TOKEN to create the Release and upload its assets.
  # The two tap jobs narrow it at the job level: tap-guard gets no
  # scope at all, homebrew-tap only contents: read. The one stored secret this
  # workflow reads is TAP_TOKEN — a fine-grained PAT on dimpurr/homebrew-tap,
  # used only by the homebrew-tap job to clone that repository, push a branch,
  # and open a draft PR, because the auto-generated GITHUB_TOKEN cannot write
  # to another repository.
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # The tag, and the gates that must hold before anything is built.
  # ---------------------------------------------------------------------------
  gates:
    name: gates (tag shape + source gates)
    runs-on: ubuntu-24.04
    outputs:
      # Read by the release job, so the one place that knows what the two tag
      # shapes are is this job, and no downstream step re-derives it from the
      # string. A job output is the only carrier that survives the job
      # boundary; $GITHUB_ENV does not cross jobs.
      prerelease: ${{ steps.tag.outputs.prerelease }}
      # The npm dist-tag every package in this release is published under, for
      # the same reason: `latest` is npm's default for *every* version,
      # prerelease included, so an rc must be published with an explicit `next`
      # or `npm install chat-stasher` starts resolving a release candidate. Only
      # the tag shape knows which of the two a run is.
      npm_tag: ${{ steps.tag.outputs.npm_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # FIRST gate, because the tag is the release's whole identity and because
      # a wrong tag is the one failure nothing downstream can notice.
      #
      # The rule itself is scripts/release-tag-gate.sh: the ref must be a tag,
      # exactly two tag shapes are release tags (RELEASING.md, "Channels"), and
      # the tag must name the exact version Cargo.toml carries. For an rc a
      # disagreement is worse than cosmetic — an rc and the stable it is a
      # candidate for would then print the same version, which is why the rc
      # carries its `-rc.N` suffix in Cargo.toml too.
      #
      #   v0.3.0        a stable release  -> the repository's "latest", npm `latest`
      #   v0.3.0-rc.1   a candidate       -> a GitHub *prerelease*,   npm `next`
      #
      # It is a script rather than a here-doc so the rule has one owner and can
      # be exercised without pushing a tag: scripts/selftest-release-tag-gate.sh
      # drives that same file against synthetic refs, and
      # scripts/commit-message-range.sh is the same arrangement for the same
      # reason — a second copy of a gate drifts from the copy under test.
      #
      # The tag is read out of `$GITHUB_REF`, never `$GITHUB_REF_NAME`. The
      # trigger above is `v*`, and `workflow_dispatch` also accepts a *branch*:
      # a branch named `v0.3.0` has `ref_name` == `v0.3.0`, which is the whole
      # of what the shape rule looks at, so a manual run on that branch reached
      # this point looking exactly like a release. `ref` is the only thing that
      # says whether the run is a tag at all, which is why the script refuses a
      # bare name: passing `ref_name` here would go red instead of unnoticed.
      #
      # The script prints two machine-readable lines and nothing else, appended
      # verbatim to this step's outputs.
      - name: Gate — the ref is a release tag, and Cargo.toml agrees
        id: tag
        run: bash scripts/release-tag-gate.sh --ref "$GITHUB_REF" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Verify BEFORE building anything that could be published.
      #
      # 🔴 2026-08-29 — v0.1.0 shipped with its own release gate failing. The
      # tag triggered two workflows that knew nothing about each other: CI ran
      # the gate on macOS and its "Run release gate" step failed, while this
      # workflow built and published regardless. GitHub Actions has no way for
      # one workflow to depend on another (`needs:` is within-workflow only),
      # so "CI will catch it" was never true — it was an assumption with no
      # mechanism behind it.
      #
      # The fix is not more discipline. It is that the workflow which publishes
      # must itself verify what it publishes, rather than trusting a sibling.
      # These steps are that verification, in this workflow, and every build job
      # below declares `needs: gates` — a real dependency edge, so a failing
      # gate cannot be outrun by a build that already started. They run first
      # so a failure costs seconds, not five cross-compiles and a macOS runner.
      #
      # This job is the same runner and the same commands the ubuntu job in
      # ci.yml runs on every push (including scripts/release-gate.sh, which is
      # portable now — it probes for GNU `stat -c` before BSD `stat -f`).
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Gate — semantic defaults (unknown must not become a value)
        run: python3 scripts/check-semantic-defaults.py

      - name: Gate — terminology consistency
        run: python3 scripts/check-terminology.py

      - name: Gate — citation anchors
        run: python3 scripts/check-citation-drift.py

      - name: Gate — output inventory
        run: python3 scripts/output-inventory.py --check

      # One line: the script provides its own fixture and builds the debug
      # binary it needs. Previously three steps duplicated from ci.yml, with a
      # comment admitting the two copies would drift. They no longer exist.
      - name: Gate — full release gate
        run: bash scripts/release-gate.sh

  # ---------------------------------------------------------------------------
  # Builds. One artifact per release asset, each named exactly as the asset it
  # carries, so the release job's download is the asset set and a rename cannot
  # happen in between.
  # ---------------------------------------------------------------------------
  build-macos:
    name: build (darwin-arm64 + darwin-x86_64)
    needs: gates
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust with arm64 and x86_64 targets
        # Mirrors .github/workflows/ci.yml:109 (dtolnay/rust-toolchain@stable).
        # Adds both aarch64-apple-darwin and x86_64-apple-darwin targets.
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build release binaries (aarch64 + x86_64)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Stage and check the two macOS binaries
        run: |
          set -euo pipefail

          # The artifact names follow the install.sh contract, byte for byte
          # (scripts/install.sh):
          #   TARGET   = "$(uname -s)-$(uname -m)" → darwin-arm64, darwin-x86_64
          #   ARTIFACT = "chat-stasher-${TARGET}"
          ARTIFACT_ARM64="chat-stasher-darwin-arm64"
          ARTIFACT_X86="chat-stasher-darwin-x86_64"

          mkdir -p dist
          cp "target/aarch64-apple-darwin/release/chat-stasher" "dist/$ARTIFACT_ARM64"
          cp "target/x86_64-apple-darwin/release/chat-stasher" "dist/$ARTIFACT_X86"

          # Guard against a mislabeled binary: assert each Mach-O is really its
          # architecture. It is checked here, next to the build, rather than in
          # the job that publishes, because this is the job that knows which
          # target directory each file came out of.
          file "dist/$ARTIFACT_ARM64" | grep -q 'arm64' || {
            echo "error: built binary is not arm64:" >&2
            file "dist/$ARTIFACT_ARM64" >&2
            exit 1
          }
          file "dist/$ARTIFACT_X86" | grep -q 'x86_64' || {
            echo "error: built binary is not x86_64:" >&2
            file "dist/$ARTIFACT_X86" >&2
            exit 1
          }

          ls -l dist

      - name: Upload chat-stasher-darwin-arm64
        uses: actions/upload-artifact@v4
        with:
          name: chat-stasher-darwin-arm64
          path: dist/chat-stasher-darwin-arm64
          if-no-files-found: error

      - name: Upload chat-stasher-darwin-x86_64
        uses: actions/upload-artifact@v4
        with:
          name: chat-stasher-darwin-x86_64
          path: dist/chat-stasher-darwin-x86_64
          if-no-files-found: error

  build-linux:
    name: build (${{ matrix.asset }})
    needs: gates
    strategy:
      # One architecture failing must not cancel the other: the run's result is
      # the same either way, and a cancelled job reports less than a failed one.
      fail-fast: false
      matrix:
        include:
          - asset: chat-stasher-linux-x86_64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            file_machine: x86-64
          - asset: chat-stasher-linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            file_machine: ARM aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The Rust target ships musl's libc and its start files, but not a C
      # compiler for it: the C dependencies (aws-lc-sys for TLS, bundled
      # SQLite, zstd) are compiled from source by their build scripts and need
      # a compiler whose output links against musl. `musl-tools` is what puts
      # one on PATH, named `musl-gcc`, which is the name cc-rs looks for on a
      # musl target.
      #
      # `binutils` is named here for the same reason: the staging check below
      # asks `readelf` what the program headers and the dynamic section say, and
      # a dependency that is only implied by the runner image is one that can go
      # missing without anyone editing this file. It is not worth hoping for.
      - name: Install the musl C toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools binutils
          musl-gcc --version
          readelf --version | head -1

      - name: Install stable Rust with the musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build the static musl binary
        run: cargo build --release --target ${{ matrix.rust_target }}

      # The build is only half the claim: "a static musl binary" is a property
      # of the file that comes out. A build that quietly used the runner's
      # glibc would run here — this runner has glibc — and fail on the user's
      # machine, which is the one place nobody would connect back to this run.
      #
      # The check is scripts/check-static-binary.sh rather than a here-doc here
      # for the reason scripts/release-tag-gate.sh is: the rule has one owner,
      # and scripts/selftest-check-static-binary.sh drives that same script, so
      # the thing that is tested is the thing that runs. It refuses unless the
      # file has no PT_INTERP program header and no DT_NEEDED entry and then
      # runs — the header facts, not a sentence about them. Both matrix cells
      # call it with their own machine string, so the two architectures are
      # checked by identical logic.
      - name: Stage the binary, check it is static, and run it
        run: |
          set -euo pipefail

          ASSET="${{ matrix.asset }}"
          mkdir -p dist
          cp "target/${{ matrix.rust_target }}/release/chat-stasher" "dist/$ASSET"

          bash scripts/check-static-binary.sh \
            --binary "dist/$ASSET" \
            --machine "${{ matrix.file_machine }}"

      - name: Upload ${{ matrix.asset }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  build-windows:
    name: build (windows-x86_64)
    needs: gates
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and check the binary
        shell: bash
        run: |
          set -euo pipefail

          # x86_64-pc-windows-msvc is the host target of this runner, so the
          # build is explicit about it rather than relying on the default.
          cargo build --release --target x86_64-pc-windows-msvc

          ASSET="chat-stasher-windows-x86_64.exe"
          mkdir -p dist
          cp "target/x86_64-pc-windows-msvc/release/chat-stasher.exe" "dist/$ASSET"

          # The check is that it runs, not that a tool describes it: `file` on
          # a Windows runner describes the PE it is given and would pass for
          # any architecture, and this is a native runner, so starting the
          # binary is available and says more.
          "./dist/$ASSET" --version
          ls -l dist

      - name: Upload chat-stasher-windows-x86_64.exe
        uses: actions/upload-artifact@v4
        with:
          name: chat-stasher-windows-x86_64.exe
          path: dist/chat-stasher-windows-x86_64.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish. Every binary is already built; this job assembles the release's
  # asset set, checksums it, and creates the Release.
  # ---------------------------------------------------------------------------
  release:
    name: release (stage + publish)
    needs: [gates, build-macos, build-linux, build-windows]
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download every built binary
        uses: actions/download-artifact@v4
        with:
          # One artifact per release asset, merged flat into dist/ so the
          # staged set *is* the downloaded set. Nothing is renamed here.
          pattern: chat-stasher-*
          path: dist
          merge-multiple: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 23.10.0
          cache: pnpm
          cache-dependency-path: apps/extension/pnpm-lock.yaml

      - name: Install extension dependencies
        working-directory: apps/extension
        run: pnpm install --frozen-lockfile

      - name: Build stable extension zip
        working-directory: apps/extension
        run: |
          set -euo pipefail
          unset CS_RELEASE_CHANNEL
          pnpm zip

      - name: Stage artifacts (extension zip + SHA256SUMS over every binary)
        run: |
          set -euo pipefail

          ARTIFACT_DARWIN_ARM64="chat-stasher-darwin-arm64"
          ARTIFACT_DARWIN_X86="chat-stasher-darwin-x86_64"
          ARTIFACT_LINUX_X86="chat-stasher-linux-x86_64"
          ARTIFACT_LINUX_ARM64="chat-stasher-linux-arm64"
          ARTIFACT_WINDOWS_X86="chat-stasher-windows-x86_64.exe"
          BINARIES="$ARTIFACT_DARWIN_ARM64 $ARTIFACT_DARWIN_X86 $ARTIFACT_LINUX_X86 $ARTIFACT_LINUX_ARM64 $ARTIFACT_WINDOWS_X86"
          EXT_VERSION="$(node -p "require('./apps/extension/package.json').version")"
          EXT_ASSET="chat-stasher-extension-${EXT_VERSION}.zip"

          # 🔴 Every binary the build jobs produced must have arrived. A
          # download that silently dropped one would otherwise be visible only
          # in the asset-set check below, as a missing line rather than as the
          # step that lost it.
          for art in $BINARIES; do
            if [ ! -f "dist/$art" ]; then
              echo "error: the build jobs did not provide ${art}" >&2
              ls -l dist >&2
              exit 1
            fi
          done

          EXT_ZIP="$(find apps/extension/.output -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$EXT_ZIP" ]; then
            echo "error: extension zip was not produced" >&2
            exit 1
          fi
          cp "$EXT_ZIP" "dist/$EXT_ASSET"

          # The stable extension manifest must not include experimental origins.
          unzip -p "dist/$EXT_ASSET" manifest.json | python3 -c '
          import json, sys
          manifest = json.load(sys.stdin)
          serialized = json.dumps(manifest).lower()
          forbidden = [origin for origin in ("perplexity.ai", "kimi.com") if origin in serialized]
          if forbidden:
              raise SystemExit("error: stable extension manifest includes experimental origins: " + ", ".join(forbidden))
          print("stable extension manifest OK: no experimental origins")
          '

          # SHA256SUMS must parse under install.sh's exact rule
          # `awk -v a="$ARTIFACT" '$2 == a { print $1 }'` (install.sh:169), i.e.
          # one "<hex>  <filename>" line per asset. `shasum -a 256` emits the
          # same two-space separator release-artifacts.sh produces locally
          # (scripts/release-artifacts.sh:72).
          # shellcheck disable=SC2086  # word splitting is the list of assets
          ( cd dist && shasum -a 256 $BINARIES "$EXT_ASSET" > SHA256SUMS )

          # Self-check with install.sh's own awk: the digest for each asset must
          # be present. install.sh reads this manifest before it downloads
          # anything and treats a missing entry as "this release carries no
          # binary for your platform" (install.sh:170-229), so a name that does
          # not parse here is not a one-user install error — it is every user of
          # that platform being told the release does not have what it does.
          # shellcheck disable=SC2086
          for art in $BINARIES "$EXT_ASSET"; do
            EXPECTED="$(awk -v a="$art" '$2 == a { print $1 }' dist/SHA256SUMS)"
            [ -n "$EXPECTED" ] || {
              echo "error: SHA256SUMS has no entry for '${art}'" >&2
              exit 1
            }
          done

          echo "staged:"
          ls -l dist
          cat dist/SHA256SUMS

          # The extension joins stable releases only as a stable-channel zip.
          # Keep the uploaded set closed so a dev-channel build or stray file
          # cannot become an unreviewed release asset.
          # shellcheck disable=SC2086
          expected="$(printf '%s\n' $BINARIES "$EXT_ASSET" SHA256SUMS | sort)"
          actual="$(ls dist | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "error: unexpected release assets in dist/ — expected exactly:" >&2
            printf '%s\n' "$expected" >&2
            echo "got:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          echo "asset set OK: five CLI binaries + stable extension zip + SHA256SUMS"

      - name: Create Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          # Carried from the gates job, which is the only place that knows what
          # the two tag shapes are. `needs:` is what makes that ordering real
          # rather than hoped for.
          RELEASE_PRERELEASE: ${{ needs.gates.outputs.prerelease }}
        run: |
          set -euo pipefail

          # The tag is "v0.1.0"; install.sh fetches from
          # https://github.com/dimpurr/chat-stasher/releases/download/v${VERSION}
          # (install.sh:48), so the Release tag and asset names must match the
          # tag exactly — nothing is renamed here.
          TAG="$GITHUB_REF_NAME"    # e.g. v0.2.0 | v0.3.0-rc.1
          VERSION="${TAG#v}"        # e.g. 0.2.0 | 0.3.0-rc.1

          # --- stable vs release candidate ----------------------------------
          # The shape was decided once, by the "Gate — tag shape and version
          # agreement" step in the gates job, which is the only place that knows
          # what the two shapes are; this step reads its answer rather than
          # re-deriving it from the string, so the two steps cannot drift apart.
          #
          # The prerelease flag is the whole mechanism that keeps an rc from
          # becoming the repository's "latest" release, and "latest" is what a
          # reader of the Releases page means by stable. Without it an rc would
          # take the latest slot and quietly become what people install.
          # "Drafts and prereleases cannot be set as latest." —
          # https://docs.github.com/en/rest/releases/releases (read 2026-09-23)
          #
          # An unset value is NOT read as "stable": that would be the gate
          # failing open, publishing an unverified tag as the latest release.
          # It means this job reached here without the gates job, and the tag
          # was never checked.
          #
          # `${RC_FLAG:+--prerelease}` rather than a bare `$RC_FLAG`: it expands
          # to nothing when the variable is empty, so a stable tag runs the
          # exact command a stable tag ran before this branch existed.
          case "${RELEASE_PRERELEASE:-}" in
            0) RC_FLAG="" ;;
            1) RC_FLAG=1 ;;
            *)
              echo "error: RELEASE_PRERELEASE is '${RELEASE_PRERELEASE:-<unset>}', not 0 or 1 — the gates job did not run, so '${TAG}' was never verified. Refusing to publish." >&2
              exit 1
              ;;
          esac

          # The staged set, already asserted in the "Stage artifacts" step to be
          # exactly seven files. This is the set the Release must end up with.
          expected_assets="$(cd dist && ls -1 | sort)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; reconciling its asset set."
            # 🔴 A re-run must not fail on an existing asset, and must not grow
            # the published set. `gh release upload --clobber` replaces a
            # same-named asset but leaves any *other* asset in place, so a
            # mistakenly attached file (or one from an earlier draft) would
            # survive every re-run and the Release would carry more than the
            # build produced. Remove every existing asset this run does not
            # stage, then upload.
            existing_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              if printf '%s\n' "$expected_assets" | grep -qxF -- "$name"; then
                continue
              fi
              echo "removing stale release asset: ${name}"
              gh release delete-asset "$TAG" "$name" --yes
            done <<< "$existing_assets"

            gh release upload "$TAG" dist/* --clobber
          else
            echo "Creating Release ${TAG}${RC_FLAG:+ (prerelease)}."
            gh release create "$TAG" dist/* \
              ${RC_FLAG:+--prerelease} \
              --title "chat-stasher v${VERSION}" \
              --notes "Prebuilt macOS (arm64, x86_64), Linux (x86_64, arm64 — static musl) and Windows (x86_64) CLI binaries, the stable browser extension zip, and SHA256SUMS. See docs-dev/install.md for installation."
          fi

          # 🔴 The published set must equal the staged set, exactly — the same
          # seven names the "Stage artifacts" step asserted in `dist/`. Checking
          # the *result* rather than trusting the commands is what turns a
          # partial upload (a `--clobber` that lost an asset, a delete that did
          # not happen) into a red run instead of a Release that quietly
          # differs from what was built.
          published_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          if [ "$published_assets" != "$expected_assets" ]; then
            {
              echo "error: the published asset set does not match dist/."
              echo "       expected:"
              printf '%s\n' "$expected_assets"
              echo "       published:"
              printf '%s\n' "$published_assets"
            } >&2
            exit 1
          fi
          echo "published asset set OK:"
          printf '%s\n' "$published_assets"

  # ---------------------------------------------------------------------------
  # Homebrew tap update — opens a draft PR against dimpurr/homebrew-tap.
  #
  # Why this needs a second job for a one-line guard: a job-level `if` may NOT
  # read the `secrets` context (`jobs.<job_id>.if` allows only
  # `github, needs, vars, inputs` — GitHub Actions contexts reference, "Context
  # availability", read 2026-09-25:
  # https://docs.github.com/en/actions/reference/accessing-contexts-in-workflows).
  # `tap-guard` gets to read the secret because a *step* may, and publishes the
  # answer as a job output that `homebrew-tap` reads through `needs`. An absent
  # `TAP_TOKEN` therefore *skips* the update instead of failing the release run.
  #
  # This job never merges and never gates the release: it runs after the assets
  # are published, opens a draft PR for the owner to review (RELEASING.md
  # step 9), and stops.
  tap-guard:
    name: tap update preconditions
    runs-on: ubuntu-latest
    # Deciding is local: this job reads a secret and a tag name, prints a
    # reason, and publishes an output for `needs`. It never talks to GitHub's
    # API, so it needs no GITHUB_TOKEN scope at all.
    permissions: {}
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Decide whether to update the tap
        id: check
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          enabled=false
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "TAP_TOKEN is not set — skipping the Homebrew tap update."
          elif printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            enabled=true
          else
            echo "'${TAG}' is not a stable vX.Y.Z tag — skipping the Homebrew tap update."
          fi
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"

  homebrew-tap:
    name: open Homebrew tap PR (draft)
    needs: [release, tap-guard]
    if: needs.tap-guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    # The auto-generated token appears in one place — `gh release download` of
    # this run's SHA256SUMS, which reading the Release is all it needs.
    # Everything that touches dimpurr/homebrew-tap below (clone, push,
    # `gh pr create`) authenticates with TAP_TOKEN instead.
    permissions:
      contents: read

    env:
      TAG: ${{ github.ref_name }}

    steps:
      # The Release, and therefore SHA256SUMS, exists before this job starts
      # (needs: release). Reading it back is what pins the tap to the
      # bytes this run published rather than to a local rebuild.
      - name: Fetch this release's SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D .

      - name: Check out the tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          # gh reads GH_TOKEN; setup-git points git's credential helper at gh so
          # the later `git push` authenticates without the token in a URL.
          gh auth setup-git
          git clone https://github.com/dimpurr/homebrew-tap.git tap
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update Formula/chat-stasher.rb
        run: |
          set -euo pipefail
          ARM64="$(awk -v a=chat-stasher-darwin-arm64 '$2 == a { print $1 }' SHA256SUMS)"
          X86="$(awk -v a=chat-stasher-darwin-x86_64 '$2 == a { print $1 }' SHA256SUMS)"
          if [ -z "$ARM64" ] || [ -z "$X86" ]; then
            echo "error: SHA256SUMS is missing a darwin binary digest" >&2
            exit 1
          fi
          # The tag is passed as argv, never interpolated into the script text,
          # so a tag cannot become code here.
          python3 - "${TAG#v}" "$ARM64" "$X86" <<'PY'
          import re
          import sys

          version, arm64, x86 = sys.argv[1:4]
          path = "tap/Formula/chat-stasher.rb"
          with open(path) as handle:
              text = handle.read()

          # Both URLs carry the version as their `vX.Y.Z` path segment.
          text = re.sub(r"download/v[^/]+/", f"download/v{version}/", text)


          def set_sha(text, artifact, digest):
              pattern = re.compile(
                  r'(download/v[^/]+/' + re.escape(artifact) + r'"\s*\n\s*sha256 ")[0-9a-f]{64}(")'
              )
              text, count = pattern.subn(lambda m: m.group(1) + digest + m.group(2), text)
              if count != 1:
                  raise SystemExit(f"expected exactly one sha256 for {artifact}, found {count}")
              return text


          for artifact, digest in (
              ("chat-stasher-darwin-arm64", arm64),
              ("chat-stasher-darwin-x86_64", x86),
          ):
              text = set_sha(text, artifact, digest)

          with open(path, "w") as handle:
              handle.write(text)
          PY
          git --no-pager -C tap diff

      - name: Commit and open a draft PR
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="chat-stasher-${TAG#v}"
          cd tap
          git add Formula/chat-stasher.rb
          if git diff --cached --quiet; then
            echo "Formula/chat-stasher.rb already pins ${TAG#v}; nothing to open."
            exit 0
          fi
          # A pull request for this branch in *any* state means a person owns
          # the decision now. `--state all` is what makes a closed-unmerged PR
          # visible: it leaves its branch behind, and a run that looked only at
          # open PRs would push over that branch and then die on `gh pr create`.
          existing="$(gh pr list --repo dimpurr/homebrew-tap --head "$BRANCH" \
            --state all --json number,state \
            --jq 'map("\(.number) (\(.state))") | join(", ")')"
          if [ -n "$existing" ]; then
            echo "a pull request for ${BRANCH} already exists (${existing}); leaving it alone."
            exit 0
          fi
          # A clone checks out the tap's *default* branch, so the commit below
          # needs a branch of its own: without this line the push names a ref
          # that does not exist and every run dies before opening anything.
          git checkout -b "$BRANCH"
          git commit -m "chat-stasher ${TAG#v}"
          # The branch is machine-owned and carries a single commit on top of
          # main, but an earlier run can leave one behind (a PR closed without
          # being merged, its branch not deleted). --force-with-lease replaces
          # only what this clone saw when it was made: a commit a person added
          # since is a lease failure, not a silent overwrite.
          git push --force-with-lease -u origin "$BRANCH"
          gh pr create --draft --repo dimpurr/homebrew-tap \
            --base main --head "$BRANCH" \
            --title "chat-stasher ${TAG#v}" \
            --body "Automated formula update for \`chat-stasher ${TAG#v}\`.

          The two \`sha256\` values and the \`vX.Y.Z\` URL segments come from this
          release's \`SHA256SUMS\`. Review, then run \`brew audit --strict --online\`
          and \`brew style\` before merging."

  # Registry publication follows the GitHub Release and the Homebrew tap PR.
  # One sequential job preserves the required order: platform npm packages,
  # launcher package, then crates.io. Each registry checks the exact version
  # before publishing so dispatch retries do not duplicate immutable versions.
  #
  # 🔴 The npm dist-tag is not a constant, and `latest` is npm's default for
  #    *every* version, prerelease included. An rc published without an
  #    explicit `--tag` therefore becomes the version `npm install chat-stasher`
  #    resolves — the opposite of what a candidate is for. The tag shape decides
  #    which tag a run publishes under (scripts/release-tag-gate.sh), and this
  #    job reads the answer off `needs.gates.outputs.npm_tag` instead of
  #    re-deriving it from the tag string.
  #
  #    🔴 Passing `--tag` is NOT sufficient, which this comment claimed until
  #    v0.5.0-rc.2 proved otherwise. On a package's FIRST publish npm sets
  #    `latest` as well as the requested tag, so a candidate became what a plain
  #    `npm install chat-stasher` resolved. The publish step passes `--tag` and
  #    then repairs `latest` (scripts/npm-latest-tag.sh, below); neither half is
  #    enough alone, and the repair is what makes the invariant hold rather than
  #    the flag.
  #
  # 🔴 Each registry publishes with whichever credential this run has, and the
  #    token secrets are OPTIONAL. RELEASING.md has the owner remove each one
  #    after trusted publishing is configured; a step that required the secret
  #    would then fail on the very next release, which is the failure the
  #    removal was supposed to prevent.
  registry-publish:
    name: publish npm packages and crate
    # `gates` is named here for its `npm_tag` output — `needs.<job>` reaches only
    # the jobs listed, even when one is already an ancestor through another.
    needs: [gates, release, tap-guard, homebrew-tap]
    # Homebrew is optional (no token or an rc tag); its skip must not suppress
    # registry publication. The Release itself must have completed successfully.
    #
    # The ref must be a TAG, asserted here as well as in `gates`. This is the
    # job that holds the `release` environment's secrets and writes to two
    # public registries, and `workflow_dispatch` accepts a branch: `gates` is
    # what refuses one, and this line is what keeps a later edit to that gate
    # from handing this job a branch. `always()` is deliberately not enough on
    # its own — it is here so a *skipped* Homebrew job cannot suppress a
    # publish, not so an unrelated ref can reach one.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.release.result == 'success' && needs.tap-guard.result == 'success' && (needs.homebrew-tap.result == 'success' || needs.homebrew-tap.result == 'skipped') }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      # What both registries exchange for a short-lived publish credential on
      # the trusted-publishing path, where no token secret is configured.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 23.10.0
          registry-url: https://registry.npmjs.org

      # npm's own OIDC trusted-publishing support landed in npm 11.5.1
      # (docs.npmjs.com/trusted-publishers, which also puts the floor at Node
      # 22.14.0), and that is newer than the npm bundled with the Node pinned
      # above — so without this step the OIDC path has no client that speaks it.
      # Pinned rather than `npm@latest`: a release must not change because npm
      # published something overnight.
      - name: Install the npm that can do trusted publishing
        run: |
          set -euo pipefail
          npm install --global npm@11.5.1
          npm --version

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      # One place decides which credential each registry gets, so the two
      # publish steps below read a decision rather than each re-testing a
      # secret. A secret that is absent and a secret that is empty are the same
      # thing to Actions, and both mean "trusted publishing".
      - name: Resolve registry credentials
        id: creds
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "npm=token" >> "$GITHUB_OUTPUT"
            echo "npm credential: the NPM_TOKEN secret (bootstrap path)"
          else
            echo "npm=oidc" >> "$GITHUB_OUTPUT"
            echo "npm credential: trusted publishing (OIDC)"
          fi
          if [ -n "${CARGO_TOKEN:-}" ]; then
            echo "cargo=token" >> "$GITHUB_OUTPUT"
            echo "crates.io credential: the CARGO_REGISTRY_TOKEN secret (bootstrap path)"
          else
            echo "cargo=oidc" >> "$GITHUB_OUTPUT"
            echo "crates.io credential: trusted publishing (OIDC)"
          fi

      - name: Download this release's assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -D dist

      - name: Assemble checksum-verified npm packages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          case "$VERSION" in
            *-dev*) echo "error: refusing to publish a -dev version" >&2; exit 1 ;;
          esac
          # `npm-packages/` is a SIBLING of `dist/`, never a child: assemble.mjs
          # refuses an `--out` under `--assets`, because package *directories*
          # among the release assets are what break the asset-set equality the
          # release job asserts. `dist/` holds this Release's assets and nothing
          # else, and every step below that reads a package dir reads this path.
          node scripts/npm/assemble.mjs --version "$VERSION" --assets dist --out npm-packages

      - name: Publish npm platform packages, then launcher
        env:
          NPM_CREDENTIAL: ${{ steps.creds.outputs.npm }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
          NPM_TAG: ${{ needs.gates.outputs.npm_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          case "$VERSION" in
            *-dev*) echo "error: refusing to publish a -dev version" >&2; exit 1 ;;
          esac
          # Every spec below is written `./…` for a reason that has nothing to do
          # with the publish itself. A two-segment RELATIVE path is a GitHub
          # shorthand to npm, not a directory: `npm publish foo/bar` resolves to
          # `github:foo/bar`, runs `git ls-remote` against it, and fails with
          # "Repository not found" for a name that was only ever a local
          # directory. `npm-packages/chat-stasher` is exactly that shape, and
          # `npm-packages/@dimpurr/…` is not — so without the `./` the launcher
          # would fail while the five platform packages succeeded, which reads
          # as a publishing problem rather than a path problem. `./` says
          # folder whatever the path's shape.
          # (`dist/npm/chat-stasher`, the path this replaced, was three segments
          # deep and so escaped the shorthand by accident.)
          if [ -z "${NPM_TAG:-}" ]; then
            echo "error: no npm dist-tag for this run; the tag gate did not answer" >&2
            exit 1
          fi

          # `actions/setup-node` with `registry-url` writes
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into its .npmrc.
          # On the trusted-publishing path that variable is unset, and npm reads
          # the placeholder as "auth is configured, but empty" rather than "no
          # auth, so try OIDC" — it never exchanges the OIDC token and fails
          # with ENEEDAUTH, or a 404 that looks like a missing trusted publisher
          # (actions/setup-node#1551). Removing the line is what lets npm find
          # ACTIONS_ID_TOKEN_REQUEST_TOKEN and do the exchange.
          if [ "$NPM_CREDENTIAL" = "token" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
            echo "npm credential: the NPM_TOKEN secret (bootstrap path)."
          else
            npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
            if [ -f "$npmrc" ]; then
              # Plain `sed` into a file and a rename, not `sed -i`: `sed -i`
              # with no argument after it is GNU-only, and BSD sed reads the
              # next word as the backup suffix and dies with "invalid command
              # code". The runner is Linux, but a step that cannot be replayed
              # on the machine this is developed on cannot be checked there
              # either — this one was — and a failure here is silent ENEEDAUTH
              # at publish time. Reading into a new file also means a sed that
              # cannot read the original exits non-zero and stops the step,
              # rather than leaving an emptied .npmrc behind.
              sed '/_authToken/d' "$npmrc" > "$npmrc.stripped"
              mv "$npmrc.stripped" "$npmrc"
            fi
            echo "npm credential: trusted publishing (OIDC)."
          fi

          if [ "$DRY_RUN" = "true" ]; then
            for package_dir in npm-packages/@dimpurr/*; do
              npm publish "./$package_dir" --dry-run --access public --tag "$NPM_TAG"
            done
            npm publish ./npm-packages/chat-stasher --dry-run --access public --tag "$NPM_TAG"
            exit 0
          fi

          publish_if_missing() {
            package_dir="$1"
            package_name="$(node -p "require('./' + process.argv[1] + '/package.json').name" "$package_dir")"
            if output="$(npm view "${package_name}@${VERSION}" version 2>&1)"; then
              echo "${package_name}@${VERSION} already exists; skipping."
            elif printf '%s\n' "$output" | grep -q 'E404'; then
              npm publish "./$package_dir" --access public --provenance --tag "$NPM_TAG"
            else
              echo "error: could not determine whether ${package_name}@${VERSION} exists" >&2
              printf '%s\n' "$output" >&2
              return 1
            fi
          }

          for package_dir in npm-packages/@dimpurr/*; do
            publish_if_missing "$package_dir"
          done
          publish_if_missing npm-packages/chat-stasher

          # 🔴 What the publishes above cannot do for themselves, and why the
          #    `--tag` they pass is necessary but not sufficient.
          #
          #    npm sets `latest` on a package's FIRST publish even when `--tag`
          #    names another tag — the docs say it does not, and the registry
          #    says otherwise. `latest` is what `npm install chat-stasher`
          #    resolves when the user names no version, so an rc published that
          #    way becomes the version a plain install gets, which is the
          #    opposite of what a candidate is for. Measured on v0.5.0-rc.2
          #    (run 36137101318): all six packages came back with
          #    `latest = 0.5.0-rc.2`.
          #
          #    The repair runs on every release, not only on an rc, because its
          #    rule is an invariant rather than a step in a sequence: `latest`
          #    must never point at a prerelease. On a stable release it finds
          #    `latest` already correct and changes nothing, so it costs one
          #    read per package and cannot undo the publish above. It is a
          #    script so that the decision — re-point at the newest stable, or
          #    say in the summary that there is none yet — is the thing
          #    scripts/selftest-npm-latest-tag.sh drives.
          #
          #    The dry-run path returned above: a dry run published nothing, so
          #    there is no tag for it to have left wrong.
          repair_args=""
          for package_dir in npm-packages/@dimpurr/*; do
            repair_args="${repair_args} --package-dir ${package_dir}"
          done
          # Deliberately unquoted: repair_args is an assembled word list of
          # paths this step built itself, one of which is `npm-packages/@dimpurr/…`.
          # shellcheck disable=SC2086
          bash scripts/npm-latest-tag.sh $repair_args --package-dir npm-packages/chat-stasher

      # crates.io trusted publishing: exchange the run's OIDC token for a
      # short-lived registry token, which the action also revokes in its post
      # step. It runs only when no bootstrap secret is configured, because a
      # trusted publisher cannot be set up for a crate that does not exist yet —
      # the first publish of each registry necessarily uses its token.
      - name: Get a crates.io token through OIDC
        id: crates-auth
        if: ${{ steps.creds.outputs.cargo == 'oidc' }}
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate to crates.io
        env:
          # Exactly one of these is set: the step above runs only when the
          # secret is absent.
          OIDC_TOKEN: ${{ steps.crates-auth.outputs.token }}
          TOKEN_SECRET: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          case "$VERSION" in
            *-dev*) echo "error: refusing to publish a -dev version" >&2; exit 1 ;;
          esac
          # A dry run uploads nothing, so it needs no credential at all.
          if [ "$DRY_RUN" = "true" ]; then
            cargo publish --dry-run --locked -p chat-stasher
            exit 0
          fi

          if [ -n "${OIDC_TOKEN:-}" ]; then
            CARGO_REGISTRY_TOKEN="$OIDC_TOKEN"
            echo "crates.io credential: trusted publishing (OIDC)."
          else
            CARGO_REGISTRY_TOKEN="${TOKEN_SECRET:-}"
            echo "crates.io credential: the CARGO_REGISTRY_TOKEN secret (bootstrap path)."
          fi
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            {
              echo "error: no crates.io credential for this run."
              echo "       Neither the OIDC exchange nor CARGO_REGISTRY_TOKEN"
              echo "       produced a token, and the crate cannot be published"
              echo "       without one. See RELEASING.md, 'Registry credentials'."
            } >&2
            exit 1
          fi
          export CARGO_REGISTRY_TOKEN

          # 🔴 The lookup is a script, not a line here, for two reasons that are
          #    the same reason: the request has to identify itself, and the rule
          #    about which answer means what has to be testable.
          #
          #    crates.io enforces a data-access policy (https://crates.io/
          #    data-access) and refuses a request whose User-Agent names only
          #    the HTTP client library. `curl` sends `curl/<version>` on its
          #    own, which is that case — so the version this replaced got a
          #    HTTP 403, and v0.5.0-rc.2 lost its crates.io publish to it (run
          #    36137101318). The script sends a User-Agent that identifies this
          #    project and carries its URL.
          #
          #    Its exit code is the second half. 0 means the question was
          #    answered either way; 3 means it was NOT answered — a 403, a 429,
          #    a 5xx, a transport failure — in which case this line stops the
          #    step rather than letting anything below read as "not published".
          #    "We do not know" must never become "publish it": that is how the
          #    same bug destroyed a release in another project
          #    (p-diogo/totalreclaw PR #632).
          state="$(bash scripts/crates-version-state.sh --crate chat-stasher --version "$VERSION")"
          case "$state" in
            state=published) echo "chat-stasher ${VERSION} already exists; skipping." ;;
            state=absent) cargo publish --locked -p chat-stasher ;;
            *)
              {
                echo "error: crates-version-state.sh answered '${state}', which is"
                echo "       neither published nor absent, so whether"
                echo "       chat-stasher ${VERSION} exists is UNKNOWN. Refusing to guess:"
                echo "       publishing over an existing version cannot be undone."
              } >&2
              exit 1
              ;;
          esac

# Each registry publishes with the `release` environment's token secret when it
# has one, and with GitHub OIDC trusted publishing when it does not:
#
#   npm        NPM_TOKEN              trusted publisher on npmjs.com, for
#                                     dimpurr/chat-stasher and this filename
#   crates.io  CARGO_REGISTRY_TOKEN   trusted publisher on crates.io, for the
#                                     same repository, filename and environment
#
# Neither bootstrap can be skipped: a trusted publisher can be configured only
# for a package that already exists, so each registry's first publish uses its
# token and the secret is removed afterwards (RELEASING.md, "Registry
# credentials"). From then on this job runs on OIDC alone, which is why the
# token paths above are optional rather than required.
