name: Commit messages are English

# The commit-message gate must run on commits ci.yml would otherwise never see:
# a pull request's commits (so a merge cannot smuggle a non-English commit in)
# and every push to every branch (so the rule is enforced when the commit is
# recorded, not only after the branch reaches main). This is deliberately a
# SEPARATE workflow rather than more triggers on ci.yml: it runs only the cheap
# Python gate - no Rust, no extension, no e2e matrix - so it can fire on every
# push and every pull request without reviving the expensive matrix ci.yml runs
# only on main and tags. Both this workflow and ci.yml's gates job call
# scripts/commit-message-range.sh, so the event -> range mapping is written once.
on:
  pull_request:
  push:
    branches: ['**']

# A burst of pushes to one ref cancels the run behind it: the newest push views
# the whole branch, so only its result matters.
concurrency:
  group: commit-msgs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: commit messages are English (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing here: the gate compares a RANGE of commits
      # (base..head on a PR, before..sha on a push, origin/main..HEAD when the
      # before-sha is unusable), and a depth-1 checkout has no base commit to
      # compare against - with default depth the range would degrade to
      # "check the tip", which is a smaller claim than this job makes.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit messages are English
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/commit-message-range.sh

      # The same reason the self-test runs in ci.yml: a gate that cannot prove
      # it still catches anything is worth nothing.
      - name: Commit-message gate self-test
        run: python3 scripts/check-commit-messages.py --selftest