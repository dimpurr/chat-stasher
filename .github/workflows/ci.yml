name: CI

# Back on `push` as of 2026-08-17: the cross-platform matrix is green on all
# four jobs, so a run per push now costs the owner nothing.
#
# It was manual-only for a stretch, on the owner's instruction, because a red
# matrix meant a failure email on every push. What was *not* done during that
# stretch is the part worth remembering: no job was deleted, no assertion was
# weakened, and no `continue-on-error` was added. That matrix went on to surface
# eight distinct real defects that never appear on macOS — among them a `view`
# that could not start on Windows at all, and a doctor table that reported
# "0 sessions" for a harness whose history was sitting on disk.
#
# If it goes red again and the noise is a problem, switch back to
# `workflow_dispatch:` only — never to a green-by-suppression config.
# 🔴 2026-08-18 01:5x — back to manual-only, and the reason is NOT the one from
# the red-matrix stretch. GitHub refused to start ANY job:
#
#   "The job was not started because recent account payments have failed or your
#    spending limit needs to be increased."
#
# All four jobs died in 3-5 seconds without running a single step. Leaving
# `push:` on buys no information at all — it only mails the owner one failure
# notice per push. That is a different situation from a matrix that is red
# because it found something, and it is still not a green-by-suppression
# config: no job was removed, no assertion weakened, no `continue-on-error`.
#
# Put `push:` and `pull_request:` back the moment the billing issue is fixed.
# 🔴 2026-08-18 10:4x — 仓库已转 public（Actions 不再计费），但触发频率【仍然要降】，
# 理由与钱无关，是这次算出来的两个数字：
#
#   * 一次 run = 4 个 job，平均墙钟 10.5 分钟。而计费/排队是按「时长 × 系统倍率」，
#     倍率 Linux ×1 · Windows ×2 · macOS ×10 ⇒ **macOS 那一格约占一次 run 成本的 77%**。
#   * 私有仓时代 Free 计划 2000 分钟/月 ≈ 13 次 run。而一个通宵 loop 会 push 二十次。
#     账单炸掉不是意外，是必然。
#
# 更根本的一条：**CI 唯一能给而本地给不了的，是 Windows 和 Linux。**
# macOS 侧每张工单都在本机跑过 `cargo test` + `release-gate` + 两道 clippy，
# 每次 push 再跑一遍 macOS 是纯重复。
#
# 所以：
#   - `workflow_dispatch` —— 改了路径处理/文件系统/环境变量这类跨平台敏感的东西时，手动点。
#   - `push: tags: v*`    —— 每个发布候选跑【全矩阵】，含 macOS。要发的东西必须四格全绿过一次。
#   - `schedule` 每天一次 —— 防「两周没跑，一跑十个问题」。1 次/天 vs 20 次/天。
#   - ~~每次 push~~       —— 删掉。
#
# 🔴 2026-08-28 —— `push: branches: [main]` 加回来，但【只跑 ubuntu 一格】。
# 触发这次修改的不是省钱，是一次实测到的代价：ubuntu 格因为一条 macOS-only 的
# `stat -f%z` 断言红了【整整两天】没人发现，因为主干上根本没有东西会去戳它。
# 「每天一次」在人一天推二十次的节奏下，等于「问题最多藏 12 小时」。
#
# 为什么只加 ubuntu（×1）而不连 Windows（×2）一起加：
#   Windows 格此刻正因为一个真 bug 红着（STATUS_STACK_OVERFLOW，见 b63_honesty_test）。
#   现在把它挂上 push，效果就是【每次 push 发一封失败邮件】—— 正是 08-18 花力气
#   摆脱的那种纯噪音。⇒ 等那个 bug 修好，再把 windows 加进 push 这一档。
#   （Windows 才是真正抓得到东西的那格：它一个人贡献了八个 macOS 上永不出现的缺陷。）
#
# ⚠️ 同样不是 green-by-suppression：矩阵没删格、断言没弱化、没有 continue-on-error。
# push 这一档少跑的两格，在 tag 与每日定时里一格不少。
#
# ⚠️ 这【不是】green-by-suppression：没有删任何 job、没有弱化任何断言、
# 没有加 `continue-on-error`。矩阵原样保留，只是不再每次 commit 都跑。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    # 每天 UTC 18:00 跑一次（伦敦晚上，不与人的工作时段抢排队）
    - cron: '0 18 * * *'

# 连着 push 三次时只跑最后一次，前两次自动取消。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the other OSes when one fails: a Windows-only failure is
      # information we want, not a reason to hide the Linux result.
      fail-fast: false
      # 🔴 矩阵按触发方式算，不是写死的：
      #   打 tag（发布候选）    ⇒ 三格全跑，含 macOS 与 release-gate；
      #   push 到 main         ⇒ 只跑 ubuntu（×1，最便宜的一格，图的是「合进去就知道」）；
      #   其余（手动 / 每日定时）⇒ 跑 Linux + Windows。
      # 理由：macOS 那一格占一次 run 约 77% 的成本（×10 倍率），
      # 而本机每张工单都已经跑过同样五条命令 —— CI 唯一给得了而本机给不了的是 Linux 与 Windows。
      # ⚠️ 这不是删 job：发版路径上 macOS 与 release-gate 一格不少。
      matrix:
        include: ${{ fromJSON(github.ref_type == 'tag'
          && '[{"os":"macos-latest"},{"os":"ubuntu-latest"},{"os":"windows-latest"}]'
          || (github.event_name == 'push')
          && '[{"os":"ubuntu-latest"}]'
          || '[{"os":"ubuntu-latest"},{"os":"windows-latest"}]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy failure-handling gate
        run: cargo clippy --all-targets -- -D clippy::let_underscore_must_use

      # Second, narrower gate. Scope and lint choice are both deliberate:
      #
      #   * `--lib`, not `--all-targets`. Tests SHOULD panic when a premise
      #     fails, so `unwrap` in a test is correct, not debt. Measured
      #     2026-08-18: `--all-targets` has 670 `unwrap` sites, `--lib` has 1.
      #     Denying it repo-wide would mean ~670 suppressions, which teaches
      #     `#[allow]` as a reflex instead of catching anything.
      #   * `unwrap_used` only, NOT `expect_used`. `expect` forces the author
      #     to write down why the value cannot be absent, and prints that
      #     reason if it ever is. `unwrap` records nothing. The 8 `expect`
      #     sites in the lib each carry a real justification; banning them
      #     would buy a suppression per site and no information.
      #
      # One suppression exists today (doctor.rs, with a `reason`). The
      # precondition for widening the scope is now resolved: all 17
      # `writeln!(String, ..).unwrap()` sites in main.rs
      # (`render_status`/`render_archive_gap_notice`) use String::push_str/push
      # instead. Those APIs do not return fmt::Result, so the infallible
      # String sink is expressed in the type and no unwrap is needed.
      # The next scope tier would be `--all-targets`; it remains deliberately
      # out of this production gate because tests SHOULD be allowed to panic
      # on failed premises (and currently contain ~670 unwrap sites).
      - name: Clippy unwrap gate (production lib and bins)
        run: cargo clippy --lib --bins -- -D clippy::unwrap_used

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      # ---------------------------------------------------------------------
      # COVERAGE HOLE (deliberate, not masked): scripts/release-gate.sh runs
      # only on macOS.
      #
      #   * Windows: it is a `#!/usr/bin/env bash` script that shells out to
      #     `target/debug/chat-stasher` (release-gate.sh:25) — no `.exe`
      #     suffix — plus `find`/`dd`/`od`. Not run here.
      #   * Linux: it uses BSD `stat -f` (release-gate.sh:87 and :258). Both
      #     call sites sit on the `--real-data` and `--selftest` branches,
      #     which this workflow does not take, so the synthetic happy path
      #     *may* work under GNU coreutils — but that has never been executed
      #     on Linux and is therefore unverified. Not run here.
      #
      # Making the gate portable means editing scripts/, which is out of scope
      # for this workflow change. Until then these two cells are honestly
      # uncovered — they are NOT marked continue-on-error and NOT faked green.
      # ---------------------------------------------------------------------
      # One line, because scripts/release-gate.sh now provides its own synthetic
      # fixture and builds the debug binary it needs. It used to take three steps
      # here and three more in release.yml — two copies of a gate, which is how
      # gates drift apart, and the copy nobody looks at is the one that rots.
      #
      # It also moved off "macOS on a tag only": the script was macOS-only solely
      # because it used BSD `stat -f %z`, the same flag that once left the ubuntu
      # job red for two days. With that probed rather than assumed, the gate runs
      # on every push — which is the whole point, since a gate that first speaks
      # at release time can only block you at the worst possible moment.
      #
      # COVERAGE HOLE (deliberate, stated): not run on Windows. The script is
      # `#!/usr/bin/env bash` and invokes `target/debug/chat-stasher` with no
      # `.exe` suffix. That is a real gap, not a masked failure — no assertion is
      # weakened and nothing is marked continue-on-error.
      - name: Release gate
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/release-gate.sh

      # ---------------------------------------------------------------------
      # W163 · Does the *installed* CLI work end to end on Linux?
      #
      # release-gate.sh above answers "is the archive chain correct" against one
      # harness's fixture. This answers a different question: given a machine with
      # no config and a set of synthetic histories, does `doctor` -> `init` ->
      # `run-once` -> `read` -> `overview` -> `schedule` work, and does the
      # registry actually find what is on disk? It seeds every harness the
      # shipped Linux cells can be seeded for, and asserts both halves: the
      # harnesses it planted are counted, and the ones it did not plant come back
      # `unknown`/skipped rather than as a claimed `0`.
      #
      # Linux only, because that is the platform this step exists to cover —
      # the step above already runs wherever the gate can. On the ubuntu cell
      # `cargo build` has just produced the binary the smoke drives; nothing
      # else in the matrix needs it.
      #
      # It adds no trigger: it is three seconds of steps inside a job that the
      # push-to-main tier already runs, which is the point (see the policy block
      # at the top of this file — the ubuntu cell is the ×1 one that exists to
      # say "merged and broke" quickly).
      - name: Smoke — installed CLI end to end (synthetic histories)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/smoke/linux-smoke.sh

  # ---------------------------------------------------------------------------
  # W163 · The same smoke on Linux arm64.
  #
  # Why a separate job rather than a matrix cell: the matrix in `rust` already
  # decides which OSes run, and its expression is deliberately built around the
  # *trigger* (tag → three cells, push to main → ubuntu ×1, otherwise → ubuntu +
  # windows). An arm64 cell cannot be added to that expression without also
  # putting it on the push-to-main tier, and that tier is budgeted at one cell
  # on purpose. So arm64 gets its own job with its own guard.
  #
  # 🔴 Why arm64 is NOT on push: a push to main is answered by the ubuntu ×1
  # cell, which exists to say "merged and broke" as cheaply as possible. arm64
  # would double the Linux cost of every one of those pushes to re-check
  # something a main-branch push cannot regress on its own — the arm64 cell's job
  # is to prove a *release candidate* builds and runs there, and every tag
  # already runs the full matrix plus this. It is also the cell with no `-latest`
  # alias (there is no arm64 `-latest` label; `ubuntu-24.04-arm` is the current
  # one), so pinning it deliberately rather than following a moving tag is the
  # right shape for something that only speaks at release time.
  #
  # ⚠️ Not green-by-suppression: nothing here is skipped on the tiers it does
  # serve. A tag, the daily schedule and a manual dispatch all get a real build
  # and a real smoke; the push-to-main tier keeps the coverage it had, no less.
  arm64-smoke:
    name: smoke (ubuntu-24.04-arm)
    # The same three triggers the `rust` matrix lets run wide: a tag, the daily
    # schedule, or a manual dispatch. A push to main is answered by ubuntu ×1.
    if: github.ref_type == 'tag' || github.event_name != 'push'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      # Just the build. The full test suite runs on the tagged matrix cell for
      # this commit; this job's only question is whether the smoke — which walks
      # the registry, opens SQLite stores and runs the archive cycle against a
      # throwaway HOME — behaves the same on arm64 Linux as on x86_64.
      - name: Build
        run: cargo build

      - name: Smoke — installed CLI end to end (synthetic histories)
        shell: bash
        run: bash scripts/smoke/linux-smoke.sh

  # ---------------------------------------------------------------------------
  # Source-text gates. Pure Python, no build, seconds to run — so they belong on
  # EVERY push rather than at the end of the pipeline.
  #
  # 🔴 2026-08-29 — this job exists because two of these gates sat RED and unseen
  # for a long time. They lived only inside scripts/release-gate.sh, which runs
  # only on macOS, which runs only on a tag. During normal development they
  # never executed once. By the time anyone looked, check-semantic-defaults had
  # 22 violations (one of them a real defect: a dirent whose type could not be
  # read was being silently treated as "not a directory") and check-citation-drift
  # had 57 drifted anchors.
  #
  # The lesson worth keeping is not "someone forgot to run them". It is that a
  # gate placed at the last possible moment has only two outcomes: it blocks you
  # at the worst time, or — as happened here — it is bypassable and therefore
  # blocks nothing at all. A gate whose failure stops nothing is not a gate, it
  # is a log line. So they move to the earliest moment instead.
  #
  # Only the portable Python checkers move here. scripts/release-gate.sh as a
  # whole stays macOS-only: it shells out to the built binary and uses BSD
  # `stat -f`. Splitting these checkers out of it (B93) is what makes this
  # possible without duplicating their logic.
  gates:
    name: gates (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The commit-message gate is NOT run here. It lives in the dedicated
      # commit-messages.yml workflow, which fires on every push (all branches and
      # tags) and every pull request and deliberately has NO concurrency
      # cancellation. Keeping a copy of the check inside this job's cancelled
      # concurrency group is exactly how a burst of main pushes used to drop the
      # earlier push's delta - that hole is gone by having one owner and no
      # cancel-in-progress anywhere the check runs. The range logic is shared via
      # scripts/commit-message-range.sh, so no second copy can drift.
      #
      # The self-test stays: a gate that cannot prove it still catches anything
      # is worth nothing. It needs no history - it builds its own fixtures in a
      # temp repository.
      - name: Commit-message gate self-test
        run: python3 scripts/check-commit-messages.py --selftest

      - name: Semantic defaults (unknown must not become a value)
        run: python3 scripts/check-semantic-defaults.py

      - name: Terminology consistency
        run: python3 scripts/check-terminology.py

      # The lint's own self-test runs too: a lint that cannot prove it still
      # catches anything is worth nothing, and it is cheap to prove here.
      - name: Terminology lint self-test
        run: python3 scripts/check-terminology.py --selftest

      - name: Citation anchors still point at what the docs claim
        run: python3 scripts/check-citation-drift.py

      # The relocation script's own self-test, for the same reason the two
      # above are here: a gate that cannot prove it still catches anything is
      # worth nothing. It builds throwaway repositories under a temp directory
      # and never edits this checkout, so it needs no history and cannot leave
      # the tree dirty.
      - name: Citation relocation self-test
        run: bash scripts/selftest-relocate-citations.sh


      - name: Output inventory is up to date
        run: python3 scripts/output-inventory.py --check

      # The support matrix is derived from the harness registry and the
      # extension's platform table. This fails when either source moved and the
      # committed tables under scripts/support-matrix/ were not re-derived, and
      # it checks any `<!-- support-matrix:*:start/end -->` block already in
      # README.md or docs-dev/*.md. The selftest is here for the same reason as the
      # others: a gate that cannot prove it still catches staleness is not a gate.
      - name: Support matrix is up to date
        run: python3 scripts/check-support-matrix.py

      - name: Support matrix check self-test
        run: python3 scripts/check-support-matrix.py --selftest

      # The four workflows under .github/workflows/ are the only programs in
      # this repository that cannot be run before they ship: GitHub finds their
      # syntax errors, unknown keys and misspelled step outputs when it runs
      # them, and for release.yml "when it runs" means a release is being
      # published with the `release` environment's secrets in scope. actionlint
      # reads them statically instead.
      #
      # `--require` rather than a bare run: the script can also skip when it
      # cannot obtain actionlint, which is right on a laptop and wrong here, so
      # in CI a tool it cannot get is a failure rather than a green skip. The
      # version is pinned by the script and its digest is checked, so this step
      # does not depend on what the runner image happens to carry — which is
      # also why the integration with shellcheck is off: that one IS whatever
      # the image has (0.9.0 here, 0.11.0 upstream), and a gate whose answer
      # changes with the runner's optional tools is not a gate.
      - name: Workflows lint clean
        run: bash scripts/check-workflows.sh --require

      # A gate that cannot prove it still catches anything is worth nothing, so
      # the linter's own four branches are exercised here: the skip, the
      # require-failure, a failed download, and — the one the pinned digest
      # exists for — bytes that do not match the pin.
      - name: Workflow lint self-test
        run: bash scripts/check-workflows.sh --selftest

      # The tag gate is what decides whether a `Release` run may build anything,
      # and it is the only thing standing between a branch named `v0.3.0` and a
      # publication. Its probes build their own refs and Cargo.toml files, so
      # they need no tag and no history.
      - name: Release tag gate self-test
        run: bash scripts/selftest-release-tag-gate.sh

      # The other gate release.yml calls before it publishes. It decides whether
      # a Linux asset really is static, and its probes are recorded tool output
      # rather than a built binary: the Linux artifacts cannot be built on the
      # macOS host, and a check that was only ever exercised on Linux would be
      # the check nobody can reproduce. The two probes that matter most give it
      # a file(1) sentence and ELF headers that disagree — one says static-pie
      # with a PT_INTERP, the other says static-pie with a DT_NEEDED — because a
      # string-based check cannot refuse either of those and this one must.
      - name: Static binary gate self-test
        run: bash scripts/selftest-check-static-binary.sh

      # The third gate release.yml calls, and the one whose absence cost
      # v0.5.0-rc.2 its crates.io publish. Its probes shim `curl`, so the
      # statuses that matter — including the recorded 403 from crates.io's
      # data-access policy — are exercised with no network. The probe that
      # matters most is the 403: exit must be 3 with empty stdout, because the
      # branch that reads a 403 as "not published yet" is the branch that
      # publishes. The argv the shim records is also asserted, which is what
      # pins the descriptive User-Agent and the absence of `curl -f`.
      - name: crates.io version lookup self-test
        run: bash scripts/selftest-crates-version-state.sh

      # CONTRIBUTING.md lists this as a local check, so CI has to run it too, and
      # it belongs in this job rather than the extension one: it exercises the
      # reload script against a temp repository and a stub build command, so it
      # needs neither the extension toolchain nor a browser. The stub is what
      # makes the reload mechanics (atomic swap, .prev, build-number increment,
      # a failed build leaving the load dir alone) checkable without building
      # anything for real.
      - name: Extension reload script behaves
        run: bash scripts/dev/test-reload-extension.sh

      # CONTRIBUTING.md lists this as a local check, so CI has to run it too -
      # otherwise the two sets drift and a green local run stops meaning a green
      # pull request. It is in this job for the same reason the reload script's
      # test is: it serves a mock Release over file:// and shadows `uname` on
      # PATH, so it needs no network, no toolchain and no release artifact, and
      # the platform branches a Linux runner would never take on its own are
      # still exercised here.
      #
      # The suite runs every case under dash as well as bash, and lints the
      # installer with `shellcheck --shell=sh`. Both are skipped, in as many
      # words, where the tool is missing - which is correct on a developer's Mac
      # and is exactly what must not happen here: install.sh is shipped into
      # `sh`, dash IS `sh` on Debian and Ubuntu, and plain `shellcheck` assumes
      # bash and accepts the `pipefail` that made the documented install die.
      # The two tools are therefore asserted present rather than assumed, so a
      # runner that lost one goes red instead of green-with-a-skip. Both are in
      # the ubuntu-latest image (shellcheck 0.9.0-1; dash is Ubuntu's base sh),
      # so this fails only when something actually changed.
      - name: Installer suite's tools are present
        run: |
          missing=""
          for tool in dash shellcheck; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "error: missing for scripts/self-test-install.sh:$missing" >&2
            echo "       dash covers the POSIX run the 'curl | sh' path needs;" >&2
            echo "       shellcheck --shell=sh is the static form of the same check." >&2
            exit 1
          fi
          shellcheck --version

      - name: Installer platform branches (bash and dash)
        run: bash scripts/self-test-install.sh

      # The npm launcher is the one thing in this repository that runs on a
      # machine with no Rust and no build step, so its tests must not need one
      # either. They are here, in the portable job, for the same reason the
      # reload script's are: they build their own fixtures under a temp
      # directory and touch nothing else.
      #
      # Node 18 is deliberate, not incidental. It is the floor npm/package.json
      # declares in `engines`, and this step is what holds that claim to
      # something. The launcher's tests force the platform they examine with a
      # harness (`process.platform` is redefined in the child), so all of the
      # darwin-specific paths are exercised here, on Linux, rather than being
      # skipped on the one machine that runs them.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # The file list is expanded by the shell, not by the test runner: Node 18
      # has no glob support in `--test` arguments, and a new test file is picked
      # up by the glob rather than by an edit to this line.
      - name: npm launcher and packaging
        run: node --test npm/test/*.test.mjs

      # The other registry step release.yml now calls, and it is here rather
      # than with the workflow gates above for one reason: it reads a
      # package.json with `node`, so it needs the Node this job does not install
      # until the step above. GitHub runs a job's steps in order, so the version
      # the runner happens to preinstall would be what it used otherwise, and
      # the pinned 18 is the only one this job promises.
      #
      # Its probes shim `npm`, so the decision — re-point `latest` at the newest
      # stable, or write the notice — is exercised against fixtures rather than
      # the real registry, and no dist-tag anywhere is modified. Two of its
      # probes exist to catch an answer that is wrong in the direction that
      # looks like a successful repair: a lexicographic version comparison
      # (which re-points `latest` backwards, 0.9.0 over 0.10.0) and a re-point
      # when `latest` was already correct.
      - name: npm latest dist-tag self-test
        run: bash scripts/selftest-npm-latest-tag.sh

  extension:
    # COVERAGE HOLE (deliberate): the extension is built and tested on Linux
    # only. WXT/vitest on macOS and Windows runners are NOT covered by CI.
    name: extension (ubuntu-latest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/extension

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # apps/extension/package.json declares neither `engines` nor
      # `packageManager`, so there is no version to inherit. These two pins are
      # the exact toolchain the change was verified against locally
      # (`pnpm -v` -> 9.15.4, `node -v` -> v23.10.0); bump them deliberately,
      # not by accident.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 23.10.0
          cache: pnpm
          cache-dependency-path: apps/extension/pnpm-lock.yaml

      # --frozen-lockfile is load-bearing: apps/extension/pnpm-lock.yaml pins
      # wxt 0.21.4 (pnpm-lock.yaml:23-25) and this must never resolve upward.
      # It also runs the `postinstall` hook (`wxt prepare`), which generates
      # .wxt/ types that `pnpm compile` needs.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm compile

      - name: Test
        run: pnpm test

      - name: Build (chrome)
        run: pnpm build

      - name: Build (firefox)
        run: pnpm build -b firefox

  # ---------------------------------------------------------------------------
  # W25 · The capture path, in a real browser.
  #
  # Separate from `extension` on purpose. `pnpm test` runs vitest in Node with a
  # stubbed `browser`; these specs load the built extension into a real Chromium,
  # serve a fake platform on the real origins, and read the outbox back out of
  # the service worker's IndexedDB. The two answer different questions, and one
  # job would report a failure in either as a failure in both.
  #
  # Headless, and deliberately no `xvfb`: Playwright's default headless build
  # (`chromium-headless-shell`, which is what `headless: true` with no channel
  # selects) does NOT load extensions at all — measured on this change, the
  # service-worker list came back empty. `channel: 'chromium'` selects the full
  # Chromium build with the new headless mode, where the extension loads and its
  # MV3 worker starts. That pin lives in e2e/playwright.config.ts and
  # e2e/harness.ts, not here.
  #
  # The specs abort every request that is not served by their own fixtures and
  # assert that the aborted list is empty, so this job talks to no remote host.
  e2e:
    name: extension e2e (ubuntu-latest, real Chromium)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/extension

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Same two pins as the `extension` job above, and for the same reason:
      # apps/extension/package.json declares neither `engines` nor
      # `packageManager`, so there is no version to inherit.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 23.10.0
          cache: pnpm
          cache-dependency-path: apps/extension/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--with-deps` installs the shared libraries Chromium needs on a bare
      # runner. The browser build has to match the @playwright/test version the
      # lockfile resolves, so both come from the same install.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # `pnpm e2e` builds the unpacked extension (`wxt build`) and only then
      # runs the Playwright config in e2e/. A green run here means the capture
      # path worked in a browser, end to end, from a real page load.
      - name: Capture path end to end
        run: pnpm e2e
