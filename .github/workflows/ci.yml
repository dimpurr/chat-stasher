name: CI

# Back on `push` as of 2026-08-17: the cross-platform matrix is green on all
# four jobs, so a run per push now costs the owner nothing.
#
# It was manual-only for a stretch, on the owner's instruction, because a red
# matrix meant a failure email on every push. What was *not* done during that
# stretch is the part worth remembering: no job was deleted, no assertion was
# weakened, and no `continue-on-error` was added. That matrix went on to surface
# eight distinct real defects that never appear on macOS — among them a `view`
# that could not start on Windows at all, and a doctor table that reported
# "0 sessions" for a harness whose history was sitting on disk.
#
# If it goes red again and the noise is a problem, switch back to
# `workflow_dispatch:` only — never to a green-by-suppression config.
# 🔴 2026-08-18 01:5x — back to manual-only, and the reason is NOT the one from
# the red-matrix stretch. GitHub refused to start ANY job:
#
#   "The job was not started because recent account payments have failed or your
#    spending limit needs to be increased."
#
# All four jobs died in 3-5 seconds without running a single step. Leaving
# `push:` on buys no information at all — it only mails the owner one failure
# notice per push. That is a different situation from a matrix that is red
# because it found something, and it is still not a green-by-suppression
# config: no job was removed, no assertion weakened, no `continue-on-error`.
#
# Put `push:` and `pull_request:` back the moment the billing issue is fixed.
# 🔴 2026-08-18 10:4x — 仓库已转 public（Actions 不再计费），但触发频率【仍然要降】，
# 理由与钱无关，是这次算出来的两个数字：
#
#   * 一次 run = 4 个 job，平均墙钟 10.5 分钟。而计费/排队是按「时长 × 系统倍率」，
#     倍率 Linux ×1 · Windows ×2 · macOS ×10 ⇒ **macOS 那一格约占一次 run 成本的 77%**。
#   * 私有仓时代 Free 计划 2000 分钟/月 ≈ 13 次 run。而一个通宵 loop 会 push 二十次。
#     账单炸掉不是意外，是必然。
#
# 更根本的一条：**CI 唯一能给而本地给不了的，是 Windows 和 Linux。**
# macOS 侧每张工单都在本机跑过 `cargo test` + `release-gate` + 两道 clippy，
# 每次 push 再跑一遍 macOS 是纯重复。
#
# 所以：
#   - `workflow_dispatch` —— 改了路径处理/文件系统/环境变量这类跨平台敏感的东西时，手动点。
#   - `push: tags: v*`    —— 每个发布候选跑【全矩阵】，含 macOS。要发的东西必须四格全绿过一次。
#   - `schedule` 每天一次 —— 防「两周没跑，一跑十个问题」。1 次/天 vs 20 次/天。
#   - ~~每次 push~~       —— 删掉。
#
# 🔴 2026-08-28 —— `push: branches: [main]` 加回来，但【只跑 ubuntu 一格】。
# 触发这次修改的不是省钱，是一次实测到的代价：ubuntu 格因为一条 macOS-only 的
# `stat -f%z` 断言红了【整整两天】没人发现，因为主干上根本没有东西会去戳它。
# 「每天一次」在人一天推二十次的节奏下，等于「问题最多藏 12 小时」。
#
# 为什么只加 ubuntu（×1）而不连 Windows（×2）一起加：
#   Windows 格此刻正因为一个真 bug 红着（STATUS_STACK_OVERFLOW，见 b63_honesty_test）。
#   现在把它挂上 push，效果就是【每次 push 发一封失败邮件】—— 正是 08-18 花力气
#   摆脱的那种纯噪音。⇒ 等那个 bug 修好，再把 windows 加进 push 这一档。
#   （Windows 才是真正抓得到东西的那格：它一个人贡献了八个 macOS 上永不出现的缺陷。）
#
# ⚠️ 同样不是 green-by-suppression：矩阵没删格、断言没弱化、没有 continue-on-error。
# push 这一档少跑的两格，在 tag 与每日定时里一格不少。
#
# ⚠️ 这【不是】green-by-suppression：没有删任何 job、没有弱化任何断言、
# 没有加 `continue-on-error`。矩阵原样保留，只是不再每次 commit 都跑。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    # 每天 UTC 18:00 跑一次（伦敦晚上，不与人的工作时段抢排队）
    - cron: '0 18 * * *'

# 连着 push 三次时只跑最后一次，前两次自动取消。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the other OSes when one fails: a Windows-only failure is
      # information we want, not a reason to hide the Linux result.
      fail-fast: false
      # 🔴 矩阵按触发方式算，不是写死的：
      #   打 tag（发布候选）    ⇒ 三格全跑，含 macOS 与 release-gate；
      #   push 到 main         ⇒ 只跑 ubuntu（×1，最便宜的一格，图的是「合进去就知道」）；
      #   其余（手动 / 每日定时）⇒ 跑 Linux + Windows。
      # 理由：macOS 那一格占一次 run 约 77% 的成本（×10 倍率），
      # 而本机每张工单都已经跑过同样五条命令 —— CI 唯一给得了而本机给不了的是 Linux 与 Windows。
      # ⚠️ 这不是删 job：发版路径上 macOS 与 release-gate 一格不少。
      matrix:
        include: ${{ fromJSON(github.ref_type == 'tag'
          && '[{"os":"macos-latest","release_gate":true},{"os":"ubuntu-latest","release_gate":false},{"os":"windows-latest","release_gate":false}]'
          || (github.event_name == 'push')
          && '[{"os":"ubuntu-latest","release_gate":false}]'
          || '[{"os":"ubuntu-latest","release_gate":false},{"os":"windows-latest","release_gate":false}]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy failure-handling gate
        run: cargo clippy --all-targets -- -D clippy::let_underscore_must_use

      # Second, narrower gate. Scope and lint choice are both deliberate:
      #
      #   * `--lib`, not `--all-targets`. Tests SHOULD panic when a premise
      #     fails, so `unwrap` in a test is correct, not debt. Measured
      #     2026-08-18: `--all-targets` has 670 `unwrap` sites, `--lib` has 1.
      #     Denying it repo-wide would mean ~670 suppressions, which teaches
      #     `#[allow]` as a reflex instead of catching anything.
      #   * `unwrap_used` only, NOT `expect_used`. `expect` forces the author
      #     to write down why the value cannot be absent, and prints that
      #     reason if it ever is. `unwrap` records nothing. The 8 `expect`
      #     sites in the lib each carry a real justification; banning them
      #     would buy a suppression per site and no information.
      #
      # One suppression exists today (doctor.rs, with a `reason`). The
      # precondition for widening the scope is now resolved: all 17
      # `writeln!(String, ..).unwrap()` sites in main.rs
      # (`render_status`/`render_archive_gap_notice`) use String::push_str/push
      # instead. Those APIs do not return fmt::Result, so the infallible
      # String sink is expressed in the type and no unwrap is needed.
      # The next scope tier would be `--all-targets`; it remains deliberately
      # out of this production gate because tests SHOULD be allowed to panic
      # on failed premises (and currently contain ~670 unwrap sites).
      - name: Clippy unwrap gate (production lib and bins)
        run: cargo clippy --lib --bins -- -D clippy::unwrap_used

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      # ---------------------------------------------------------------------
      # COVERAGE HOLE (deliberate, not masked): scripts/release-gate.sh runs
      # only on macOS.
      #
      #   * Windows: it is a `#!/usr/bin/env bash` script that shells out to
      #     `target/debug/chat-stasher` (release-gate.sh:25) — no `.exe`
      #     suffix — plus `find`/`dd`/`od`. Not run here.
      #   * Linux: it uses BSD `stat -f` (release-gate.sh:87 and :258). Both
      #     call sites sit on the `--real-data` and `--selftest` branches,
      #     which this workflow does not take, so the synthetic happy path
      #     *may* work under GNU coreutils — but that has never been executed
      #     on Linux and is therefore unverified. Not run here.
      #
      # Making the gate portable means editing scripts/, which is out of scope
      # for this workflow change. Until then these two cells are honestly
      # uncovered — they are NOT marked continue-on-error and NOT faked green.
      # ---------------------------------------------------------------------
      - name: Create synthetic release-gate input
        if: matrix.release_gate
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="$RUNNER_TEMP/chat-stasher-claude-projects"
          mkdir -p "$fixture_root"
          for n in 1 2 3; do
            file="$fixture_root/synthetic-$n.jsonl"
            : > "$file"
            for i in $(seq 1 600); do
              printf '{"synthetic":true,"session":%s,"event":%s}\n' "$n" "$i" >> "$file"
            done
          done

      - name: Run release gate
        if: matrix.release_gate
        shell: bash
        env:
          CLAUDE_PROJECTS_DIR: ${{ runner.temp }}/chat-stasher-claude-projects
        run: bash scripts/release-gate.sh

  extension:
    # COVERAGE HOLE (deliberate): the extension is built and tested on Linux
    # only. WXT/vitest on macOS and Windows runners are NOT covered by CI.
    name: extension (ubuntu-latest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/extension

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # apps/extension/package.json declares neither `engines` nor
      # `packageManager`, so there is no version to inherit. These two pins are
      # the exact toolchain the change was verified against locally
      # (`pnpm -v` -> 9.15.4, `node -v` -> v23.10.0); bump them deliberately,
      # not by accident.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 23.10.0
          cache: pnpm
          cache-dependency-path: apps/extension/pnpm-lock.yaml

      # --frozen-lockfile is load-bearing: apps/extension/pnpm-lock.yaml pins
      # wxt 0.21.4 (pnpm-lock.yaml:23-25) and this must never resolve upward.
      # It also runs the `postinstall` hook (`wxt prepare`), which generates
      # .wxt/ types that `pnpm compile` needs.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm compile

      - name: Test
        run: pnpm test

      - name: Build (chrome)
        run: pnpm build

      - name: Build (firefox)
        run: pnpm build -b firefox
