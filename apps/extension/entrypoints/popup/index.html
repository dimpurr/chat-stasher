<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Stasher</title>
    <style>
      /* 全部内联 —— 不引外部字体/CSS，popup 页面零网络请求。 */
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        padding: 14px 16px;
        width: 340px;
        font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      h1 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
      .row { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
      .row label { cursor: pointer; user-select: none; }
      #status { font-weight: 600; }
      #running { margin: 6px 0; }
      /* C32：这一行现在会分几段说（缺什么 / 你要做什么 / 为什么），
         不保留换行的话三件事会挤成一坨，用户读不出「要我做的那一件事」在哪。 */
      #missing { margin: 6px 0; opacity: .85; white-space: pre-wrap; }
      #progress { margin: 6px 0; }
      /* C22：回溯覆盖那一行。不是错误提示，所以不做成红框；但也不许弱到看不见。 */
      #coverage { margin: 8px 0; padding: 6px 8px; font-size: 12px;
                  border-left: 3px solid rgba(128,128,128,.55); opacity: .95; }
      /* C20：失败清单那一行。刻意最显眼 —— 有东西没存下来时不许看起来一切正常。 */
      #failures {
        margin: 8px 0; padding: 8px 10px; font-weight: 600;
        border-left: 3px solid #c0392b; background: rgba(192,57,43,.10);
      }
      #clear-failures {
        margin: 0 0 8px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer;
      }
      .notes { margin: 10px 0 0; padding-top: 10px; border-top: 1px solid rgba(128,128,128,.35); }
      .notes p { margin: 8px 0; white-space: pre-wrap; opacity: .8; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Chat Stasher</h1>
    <div id="status"></div>
    <div id="failures" hidden></div>
    <button type="button" id="clear-failures" hidden></button>
    <div id="running"></div>
    <div id="missing"></div>
    <div id="progress"></div>
    <div id="coverage"></div>
    <div class="row">
      <input type="checkbox" id="toggle" />
      <label for="toggle" id="toggle-label"></label>
    </div>
    <div class="notes" id="notes"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
