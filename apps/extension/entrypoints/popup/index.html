<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Stasher</title>
    <style>
      /* All inline — no external fonts/CSS, so the popup page makes zero network requests. */
      :root { color-scheme: light dark; }
      /* The buttons below set `display: block`, which beats the browser's own
         `[hidden] { display: none }`. Without this line no button could ever be
         hidden, whatever the render code decided (seen in a real Chrome, 2026-09-14). */
      [hidden] { display: none !important; }
      body {
        margin: 0;
        padding: 14px 16px;
        width: 340px;
        font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      h1 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
      .row { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
      .row label { cursor: pointer; user-select: none; }
      #status { font-weight: 600; }
      #channel { margin: 6px 0; font-size: 12px; opacity: .9; }
      /* W2: backfill paused because the host is unreachable. It is the reason
         "nothing is happening", so it has to be prominent. */
      #pause {
        margin: 8px 0; padding: 8px 10px; font-weight: 600;
        border-left: 3px solid #b7791f; background: rgba(183,121,31,.12);
        white-space: pre-wrap; font-size: 12px;
      }
      /* W2: the outbox as it stands (waiting / rejected / capacity). An alert
         state when something was rejected; hidden when it is empty. */
      #outbox {
        margin: 8px 0; padding: 6px 8px; font-size: 12px;
        border-left: 3px solid rgba(128,128,128,.55); white-space: pre-wrap;
      }
      /* W2: the most recent export. Always shown — "whether one happened, and
         when" is itself a fact. */
      #last-export { margin: 6px 0; font-size: 12px; opacity: .85; white-space: pre-wrap; }
      #export-file {
        display: block; margin: 8px 0; padding: 6px 12px;
        font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
      }
      #running { margin: 6px 0; }
      /* C32: this line now says several things in sequence (what is missing /
         what you have to do / why), and without preserving line breaks the three
         would run together and the reader could not find "the one thing I have to do". */
      #missing { margin: 6px 0; opacity: .85; white-space: pre-wrap; }
      #progress { margin: 6px 0; }
      /* W30: the stage summary line. The same quiet box as the outbox row — it
         is a fact, not an error, so it must not compete with the red failure
         line above it. */
      #summary {
        margin: 8px 0; padding: 6px 8px; font-size: 12px;
        border-left: 3px solid rgba(128,128,128,.55);
      }
      /* ADR-032 · The coverage card: the counts, the state, and the way into the full page.
         Quiet like the stage summary — it is a fact, not an alert — and above the switch,
         because it is about what has already happened rather than what is switched on. */
      #coverage-card {
        margin: 8px 0; padding: 6px 8px; font-size: 12px;
        border-left: 3px solid rgba(128,128,128,.55);
      }
      #coverage-card .title { font-weight: 600; margin-bottom: 2px; }
      #coverage-card .line { opacity: .92; white-space: pre-wrap; }
      #open-coverage {
        display: block; margin: 8px 0 0; padding: 6px 12px;
        font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
      }
      #open-dashboard {
        display: block; margin: 8px 0; padding: 6px 12px;
        font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
      }
      #open-dashboard:disabled { cursor: default; opacity: .6; }
      /* W30: why the button is disabled, or what happened after a press. Never
         hidden when it has something to say. */
      #dashboard-note {
        margin: 6px 0; font-size: 12px; opacity: .85; white-space: pre-wrap;
      }
      /* C22: the backfill coverage line. Not an error, so no red box — but not so
         faint that it cannot be read either. */
      #coverage { margin: 8px 0; padding: 6px 8px; font-size: 12px;
                  border-left: 3px solid rgba(128,128,128,.55); opacity: .95; }
      /* C20: the failure-list line. Deliberately the most prominent thing on the
         page — when something was not stored it must not look like everything is fine. */
      #failures {
        margin: 8px 0; padding: 8px 10px; font-weight: 600;
        border-left: 3px solid #c0392b; background: rgba(192,57,43,.10);
      }
      /* C33: "start backfilling this platform". It is an ACTION, so it is a
         little more prominent than the clear button; but it only appears when
         there is a channel and no targets, and must not become permanent noise. */
      #start-backfill {
        display: block; margin: 8px 0; padding: 6px 12px;
        font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
      }
      #clear-failures {
        margin: 0 0 8px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer;
      }
      /* The language selector. Pushed to the end of the page and kept quiet:
         it is a setting, not part of what the popup has to report. */
      .row.locale { margin: 14px 0 0; font-size: 12px; opacity: .9; }
      #locale { font: inherit; font-size: 12px; }
      .notes { margin: 10px 0 0; padding-top: 10px; border-top: 1px solid rgba(128,128,128,.35); }
      .notes p { margin: 8px 0; white-space: pre-wrap; opacity: .8; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Chat Stasher</h1>
    <div id="status"></div>
    <div id="channel"></div>
    <!-- W2: backfill paused (host unreachable). The whole block is hidden when it is not paused. -->
    <div id="pause" hidden></div>
    <!-- W2: the outbox as it stands. Hidden when empty and not full. -->
    <div id="outbox" hidden></div>
    <!-- W2: the most recent export (always shown; it is a fact in itself). -->
    <div id="last-export"></div>
    <!-- W2: "export undelivered captures". Blob + <a download>, no downloads permission. -->
    <button type="button" id="export-file" hidden></button>
    <div id="failures" hidden></div>
    <button type="button" id="clear-failures" hidden></button>
    <div id="running"></div>
    <div id="missing"></div>
    <button type="button" id="start-backfill" hidden></button>
    <div id="progress"></div>
    <!-- 🔴 W30 · One summary line: what the host counts in the stage, and when
         the last successful push was. It sits under the progress line because
         the two answer the same question ("how much is there") from two sides,
         and below the failure line, which must stay the first thing an eye
         lands on when something was lost. -->
    <div id="summary"></div>
    <!-- 🔴 W30 · The dashboard. The button is always on screen — it is disabled,
         with its reason printed underneath, whenever the host has not answered,
         so an unusable control is never shown without an explanation. -->
    <button type="button" id="open-dashboard"></button>
    <div id="dashboard-note" hidden></div>
    <div id="coverage"></div>
    <!-- ADR-032 §1 · The summary card and the entry link into the standalone coverage page. -->
    <div id="coverage-card" hidden></div>
    <button type="button" id="open-coverage" hidden></button>
    <div class="row">
      <input type="checkbox" id="toggle" />
      <label for="toggle" id="toggle-label"></label>
    </div>
    <div class="notes" id="notes"></div>
    <!-- The language selector. Its options are built by main.ts from the
         catalog, each option labelled in its own language script. -->
    <div class="row locale">
      <label for="locale" id="locale-label"></label>
      <select id="locale"></select>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
