# English catalog — the default locale.
#
# Two kinds of entry live here:
#   1. the `__MSG_*__` keys the manifest references (Chrome resolves those before
#      the extension starts, from `_locales/<resolved locale>/messages.json`);
#   2. every string the popup and the toolbar badge can show.
#
# Placeholder syntax is `@wxt-dev/i18n`'s, read off the package source rather
# than from memory: named substitutions use `{name}` and are replaced in JS by
# `applyNamedSubstitutions` (node_modules/@wxt-dev/i18n/dist/utils-C75KGsJ7.mjs:2,9-13),
# while `$1`-`$9` are replaced by the browser inside `browser.i18n.getMessage`
# (node_modules/@wxt-dev/i18n/dist/index.mjs:17-20). This catalog uses `{name}`
# only, because that is the single form both code paths can reproduce
# identically (lib/i18n.ts explains why). Nothing here contains the exact
# sequence ` | `, which `@wxt-dev/i18n` reserves for plural forms (index.mjs:23).
extName: Chat Stasher
extDescription: Capture selected web chat sessions to files on your own machine.

common:
  unknownTime: unknown time
  unknownTimeShort: time unknown
  unknownSize: unknown size
  # 🔴 W36b · A one-word "I do not know", for a field that has no unit and no
  # longer sentence to carry. Never used where a number is expected.
  unknownShort: unknown

# ---------------------------------------------------------------------------
# Delivery channel (the native host)
# ---------------------------------------------------------------------------
channel:
  noCheck: >-
    Delivery channel: no host check has run yet — the extension has not asked
    the chat-stasher host anything, so it has nothing to report.
  connected: >-
    Delivery channel: connected to the chat-stasher host — stage {stage} ·
    machine {machine} · host version {hostVersion} (checked {at}).
  disconnected:
    head: >-
      Delivery channel: NOT connected to the chat-stasher host — reason: {why}
      (checked {at}).
    detail: " Detail: {detail}."
    stageKnown: " Last known stage: {stage}."
    stageNever: " No stage path has ever been learned on this machine."
    fix: " Fix: {command}"
  reason:
    unknown: unknown reason

# ---------------------------------------------------------------------------
# Outbox
# ---------------------------------------------------------------------------
outbox:
  empty: "Outbox: empty — every capture so far has been acknowledged by the host."
  head: "Outbox: {pending} waiting, {rejected} rejected — using {bytes} of {capacity}."
  full: >-
    The outbox is FULL: new captures are refused until the host takes what is
    already queued. Nothing queued was deleted.
  rejected: "Rejected by the host and kept (never retried): {kinds}."
  sample: "  · {kind}: {detail}"
  noDetail: no detail recorded
  unknownKind: unknown
  unreadable: >-
    Outbox: unreadable — this browser context has no IndexedDB, so the extension
    cannot say what is queued. Nothing has been deleted.

# ---------------------------------------------------------------------------
# Export
# ---------------------------------------------------------------------------
export:
  buttonLabel: Export undelivered captures
  emptyNote: "Nothing to export: the outbox is empty, so there is no undelivered capture."
  note: >-
    Export: last written {at} — {entries} capture(s), {bytes}, file name
    {filename}. Exported captures stay in the outbox: the host will confirm them
    as duplicates once it is reachable again.
  noHistory: "Export: no export file has been written yet."
  nothingQueued: Nothing to export.
  unreadable: >-
    Outbox: unreadable — this browser context has no IndexedDB. No export file
    was written.

# ---------------------------------------------------------------------------
# Backfill pause (the host is unreachable)
# ---------------------------------------------------------------------------
backfill:
  paused:
    head: "Backfill: PAUSED — the host is unavailable ({reason}), first noticed {at}."
    detail: " Detail: {detail}."
    tail: >-
      The conversations still owed are untouched and will be picked up from
      where they stopped when the host answers again.

# ---------------------------------------------------------------------------
# Toolbar badge
# ---------------------------------------------------------------------------
badge:
  waiting: "{pending} capture(s) waiting for the chat-stasher host"
  rejected: "{rejected} rejected by the host"
  full: the outbox is full and refusing new captures
  title: "chat-stasher: {parts}"
  unreadable: >-
    chat-stasher: the outbox cannot be read in this browser context — the
    extension cannot say what is queued. Nothing has been deleted.

# ---------------------------------------------------------------------------
# Popup
# ---------------------------------------------------------------------------
popup:
  # How `popupText` renders a button in the flattened text, so a test can see
  # whether the button appeared at all.
  buttonTag: "[Button] {label}"
  toggle:
    label: Backfill past conversations automatically
  clearFailures:
    label: Got it — clear this list
  startBackfill:
    label: Start backfilling this platform
  locale:
    label: Language
    auto: Auto
    english: English
    chinese: 中文
  # 🔴 W30 · The stage summary (the host's answer to §6.4) and the dashboard
  # button (§6.5). Every count in these sentences is either a number the host
  # measured or the word for unknown. Nothing is ever filled in with a default,
  # and a part the host could not read never becomes 0.
  summary:
    line: "{recent} · {total} · {push}"
    recent: "Last {hours} h: {count} sessions"
    recentNamed: "Last {hours} h: {count} sessions ({list})"
    recentUnknown: "Last {hours} h: unknown"
    totalNamed: "{count} in the stage"
    totalUnknown: "stage total unknown"
    harnessEntry: "{harness} {count}"
    harnessMore: "{list}, and {rest} more"
    noHarness: "(no harness prefix)"
    pushAgo: "last push {ago}"
    pushUnknown: "last push unknown"
    pushFuture: >-
      last push recorded at {at}, which has not happened yet — the clock and the
      record disagree
    agoJustNow: just now
    agoMinutes: "{count} min ago"
    agoHours: "{count} h ago"
    agoDays: "{count} d ago"
    unasked: >-
      Stage summary: this popup has not asked the host yet, so it has nothing to
      count.
    hostMissing: >-
      Stage summary: no answer from the chat-stasher host, so nothing is being
      counted here. It is installed by `chat-stasher install-native-host --stage
      <your stage path>`, pointing at a directory that exists.
    olderHost: >-
      Stage summary: the host installed in your browsers is older than this
      extension, so it does not answer a summary request at all.
    olderHostNote: >-
      The host answered “unknown message type”, which is an old host's way of
      saying it does not know this request. Install the current binary and re-run
      `chat-stasher install-native-host --stage <your stage path>`, then reopen
      this popup.
    unavailable: "Stage summary: the host did not answer (reason: {reason})."
    failedNote: "Stage summary: no answer from the host — {detail}"
    noteTotal: "Why the stage total is unknown — {why}"
    noteRecent: "Why the count for the window above is unknown — {why}"
    notePush: "Why the last push time is unknown — {why}"
  dashboard:
    label: Open dashboard
    opening: >-
      Starting the dashboard… the host is launching it now, so the button stays
      disabled until it answers — a second press would start a second one.
    opened: "Dashboard opened in a new tab. The URL in it is a secret while it runs — do not share it."
    refusedUrl: >-
      No tab was opened: the host's answer was not a dashboard URL on 127.0.0.1,
      so this extension did not open it.
    failed: "No tab was opened: {detail}"
    reason:
      noAnswer: >-
        Open dashboard is unavailable: the host has not answered a summary
        request, so there is nothing it could open.
      hostMissing: >-
        Open dashboard is unavailable: the chat-stasher host does not answer.
        Install it with `chat-stasher install-native-host --stage <your stage
        path>`.
      olderHost: >-
        Open dashboard is unavailable: the installed host is older than this
        extension and does not know this request. Install the current binary and
        re-run `chat-stasher install-native-host --stage <your stage path>`.
      failed: "Open dashboard is unavailable: {detail}"
  status:
    hostPaused: >-
      Status: the switch is ON, but this machine's host is unreachable, so
      backfill paused itself (not one debt was touched)
    on: "Status: the switch is ON"
    off: "Status: the switch is OFF (that is the default; you have to turn it on yourself)"
  running:
    noStore: "Running: NOT running — browser storage is unavailable."
    disabled: "Running: NOT running — the switch is off."
    hostPaused: >-
      Running: NOT running — this machine's host is unreachable, so it is
      paused; the debts are untouched, and the next heartbeat asks whether the
      host is there first and carries on from the same item once it answers.
    noTargets: >-
      Running: NOT running — the switch is on, but there are no backfill targets
      at all, so the alarm wakes up with nothing to do and not one conversation
      is being fetched. The line below says the one thing you have to do.
    noHttpPort: >-
      Running: NOT running — the switch is on, but there is no usable fetch
      channel right now, so not one conversation is being fetched.
    active: >-
      Running: archiving — one debt is cleared automatically at an irregular
      interval of about {minMinutes} to {maxMinutes} minutes (never a fixed
      period), at most {maxPerDay} a day, and never less than
      {minIntervalSeconds} seconds apart.
  missing:
    noStore: >-
      Missing: browser.storage.local. Without persistence there is no
      stop-and-resume, and rather than crawl from scratch on every restart it
      does not run at all.
    noHttpPort: >-
      Missing: an open, logged-in page of a supported platform — the fetch
      channel borrows it to exist. Past conversations are only ever fetched
      inside your own browser page (a same-origin request, using the login you
      already have), so as long as no tab of a supported platform is open this
      leg cannot fetch anything. Open any one of those platform pages and leave
      it open, and it will carry on by itself.
    noTargets:
      buttonHint: |-
        You can also just press the “{button}” button below this paragraph —
        that counts as you saying outright “backfill this platform”, and only
        then do we record it as a backfill target. (We still do not guess your
        account: that archive scope is recorded as default, and once you really
        have been archived once, the real account gets a record of its own.)
      body: |-
        Missing: one conversation that really has been archived once — backfill needs it to learn which platform and which account's history to fetch.
        The one thing for you to do now: send a message on this platform, or open a conversation you already have, and let it be archived LIVE once (it is handed to the chat-stasher host on your machine as usual). Only after that capture do we note this platform and this account, and backfill starts walking backwards from that account.
        🔴 Why that one capture is unavoidable: we do not guess your account, we only use the one you actually used. This extension has no host permissions at all, and history is only fetched inside pages you have already opened and already logged into; until you have really used it once, we will neither guess an account nor walk the whole platform's conversations.
        (How long it takes depends on how much history you have and how long the page stays open — no time promise is given here, and progress is shown one item at a time below.)
    hostPaused: >-
      Missing: the chat-stasher host on this machine does not answer. It is
      installed by `chat-stasher install-native-host --stage <your stage path>`
      pointing at a directory that exists; once that is done this leg recovers
      by itself (the heartbeat asks the host first), with nothing for you to
      click.
  failures:
    head: "🔴 Failures: {count} past conversation(s) had their body fetched but were NOT stored, and they will NOT be retried automatically."
    headDropped: >-
      🔴 Failures: {count} past conversation(s) had their body fetched but were
      NOT stored, and they will NOT be retried automatically. (The list keeps at
      most {max}; {dropped} older one(s) are no longer on it.)
  failureNote:
    title: "These were not stored (newest first):"
    row: "· {platform} · conversation {shortId}… · {reason} · {at}"
    retry: >-
      🔴 They will not be retried automatically — deliberately: the same exit has
      just failed once, and hammering it again would only repeat the same
      failure and make you think it is fine now.
    ledger: >-
      On the debt ledger they count neither as archived nor as queued, so the
      numbers in the progress line do not pass them off as successes.
    clear: >-
      Clearing this list only means “I have seen it”; it does not trigger any
      re-fetch.
  lastTick:
    none: >-
      Alarm: storage holds no record of the alarm ever firing — it may not have
      woken up for the first time yet. (This line is saying “I do not know”, not
      “it is not running”.)
    ran: >-
      Alarm: the last wake-up was {when}, and that tick really ran ({targets}
      backfill target(s) in the registry).
    skipped: >-
      Alarm: the last wake-up was {when}, and that tick did nothing at all —
      {reason} ({targets} backfill target(s) in the registry at the time).
    # 🔴 W36b · A tick that RAN is not a tick that got anywhere. `ran: true` next
    # to a storage layout that had not moved is what the first real-Chrome
    # acceptance read, and this line is the missing half: the run's own stop
    # reason, which used to be thrown away before it reached storage.
    halted: >-
      And that tick stopped before it could finish: {reason}. Technical detail:
      {detail}
    # 🔴 W45 · The one halt that is a LOSS rather than a pause, so it may not be
    # read out through `halted` above: that sentence says "stopped before it could
    # finish", which is exactly what a temporary pause says too. This one has to
    # name the two facts that make it different — the progress record listed
    # conversations that were no longer there, and the scope was reset so the list
    # is read again — because a user who is not told the second one sees an
    # unexplained re-listing days later.
    ledgerMismatch: >-
      And that tick refused to fetch anything: this platform's progress record
      listed conversations that its debt store no longer held, so there was no
      debt set left to work through. No conversation was written off, and the leg
      tried to reset this scope so its conversation list is read again from the
      start — the detail below says what it recorded and whether that succeeded.
      Technical detail: {detail}
  progress:
    notStarted: >-
      Progress: not started yet — storage holds no debt set for this platform,
      which means nothing has been enumerated at all.
    line: "Progress: {progress}"
  coverage:
    all: "Backfill coverage: every platform supported today ({yes}) can backfill past conversations."
    partial: >-
      Backfill coverage: right now only {yes} can backfill past conversations;
      {no} cannot yet. Their live archiving works as usual (the conversation you
      are looking at is still stored) — it is only the past that cannot be
      fetched back yet, which is not a breakdown and not an absence of history:
      we simply have not learned to read their history lists yet.
    noteTitle: "These platforms cannot backfill history yet; here is where each one is stuck:"
    noteWhy: >-
      🔴 We will not guess a request URL just to make it look like something is
      moving: getting it wrong produces no error, only the impression that
      history is being backfilled while not one conversation is. Saying plainly
      that it is not supported yet is the better answer.
  notes:
    target: "This progress is for: platform {platform} · archive scope {scope}"
    noTarget: >-
      There is no backfill record for any platform yet, so there is no archive
      scope to show here.
    # 🔴 W36b · The pre-W18 storage layout, said out loud where it was found.
    # These two are NOT the same sentence, and the difference is the whole point:
    # `moved` is a completed repair, `refused` means the old record is still
    # holding the user's ids and this leg will not touch it.
    legacy:
      moved: >-
        Storage layout: this page moved {count} older (pre-W18) backfill record(s)
        into the current layout before displaying anything, so what is shown above
        is the record as it now stands. Nothing was lost: an older record is only
        deleted after its contents have been written and read back.
      refused: >-
        Storage layout: {found} older (pre-W18) backfill record(s) were found and
        only {moved} could be moved. The rest are still in storage, untouched, and
        this leg will not run against them — the ids in them are yours and are not
        being discarded. Reason: {reason}. Technical detail: {detail}
    # 🔴 W43 · A top frame that told us its own capture hook is not working. Until
    # this existed, such a page produced an empty stage — exactly what a page
    # where the user opened no conversation produces — so the two states were
    # one state in everything the user could see.
    # The sentence states the observation and the one action that fixes it, and
    # it does NOT name a cause: the measurement behind it (2026-09-19) left the
    # cause of one of the two platforms it was seen on unsettled.
    hook:
      notInstalled: >-
        {origin} (platform: {platform}) reported that its live-capture hook is
        not working. A conversation you open there is not archived, and this
        page looked the same as a page where you opened nothing until this line
        was recorded. What was observed, as of {when}: {reasons}. Reloading the
        tab is the way to get a fresh observation from that page.
      reason:
        didNotRun: no copy of the hook ran in that page at all
        didNotTake: the hook ran, and the page's own global refused its patch
        wasReplaced: the hook was installed, and something replaced it afterwards
      # 🔴 W47 · A page told us about its own capture hook and background did NOT
      # write it down. That case used to produce nothing at all — no record, no
      # line in any console a person can read — so it looked exactly like a page
      # that had said nothing, and a report arriving every 5 seconds was
      # indistinguishable from silence (that is the day this exists for).
      # The sentence says which page, that it was received, and that it was not
      # recorded — three facts, and it does not guess at a cause.
      declinedOrigin: >-
        {origin} reported something about its own live-capture hook, and it was
        not recorded: this extension is not built for that site, so it does not
        install a capture hook there and will not say that it did. The page's own
        report reached the extension and was received as of {when}. The same
        report refused in a row so far: {count}.
      # The message did not survive the check every report has to pass (its
      # origin, its time, or its reason code was not one this build can read), so
      # neither the origin nor the observation is known and neither is guessed at.
      declinedMessage: >-
        A page sent a live-capture report that this build could not read, so
        nothing was recorded from it. The report arrived as of {when}; which page
        sent it and what it observed are exactly the parts that did not check out.
        The same report refused in a row so far: {count}.
      declinedOther: >-
        A page's live-capture report was received as of {when} and was not
        recorded ({reason}); this build does not know that reason code. The same
        report refused in a row so far: {count}.
    whatOpening: >-
      What turning it on does: as long as one page of a supported platform is
      open, it quietly backfills one past conversation in the background at an
      irregular interval of about {minMinutes} to {maxMinutes} minutes (never a
      fixed period), using the login of that page of yours; at most {maxPerDay}
      a day, so a long history fills in over several days. Turning it off stops
      it (and clears the timer with it).
    # 🔴 W45 · The durable half of the `ledger-mismatch` refusal (see
    # `popup.lastTick.ledgerMismatch`). That sentence is a run's halt record and
    # is gone as soon as the scope is re-listed — which is the point of the
    # repair, and exactly why it cannot be the only place this is said. This one
    # reads the header, so it survives, and it says the one cost the user would
    # otherwise have to guess at: the ids are gone, so a conversation that had
    # already been archived cannot be told from one that never was.
    relisted: >-
      Backfill history for this platform: on {when} its progress record listed
      {recorded} conversation id(s) and the stored debt set held only {held}. The
      record of what had already been fetched could not be recovered, so the
      conversation list was read again from the start and those conversations are
      being worked through a second time. Nothing was deleted from your archive.
    halted:
      unsupportedPlatform: >-
        This platform ({platform}) has no history backfill implemented, so this
        leg stopped before issuing any request. This is not a platform change
        and not rate-limiting. Technical detail: {detail}
      detailUnsupported: >-
        This platform ({platform}) has already had its past conversations LISTED
        ({pending} waiting), but the step that fetches each conversation's body
        is not implemented yet, so this leg stopped before fetching the first
        body and nothing has been stored so far. This is not a platform change
        and not rate-limiting; the listed ones stay put and are worked through
        once that step lands. Technical detail: {detail}
      # 🔴 W31c · The two organization halts, in plain words and in their own
      # sentences. They are NOT the `other` fallback: that one would print the
      # reason code and the technical detail at a user whose actual question is
      # "what do I do now", and both of these have exactly one answer.
      # They carry no `{detail}` on purpose — the detail stays on the record and in
      # the log, and what is shown here is the action that resolves it.
      orgAmbiguous: >-
        This Claude account belongs to several organizations, and nothing on the
        page says which one to back up — so this leg stopped before requesting
        anything. Open a conversation in the organization you want archived, and
        it will pick up that one.
      orgUnresolved: >-
        This leg stopped before requesting anything because it could not tell
        which Claude organization this account is using. Open a Claude
        conversation once, and it will find your organization.
      waitingRetry: >-
        This leg is NOT stopped and nothing has been written off: the platform
        refused or dropped a request ({reason}), so it is waiting out its backoff
        and will carry on by itself, from exactly the same place, in about
        {minutes} minute(s). That is attempt {attempts} of this streak — if the
        number keeps climbing, the platform is genuinely unhappy rather than
        briefly unreachable. Technical detail: {detail}
      other: "This leg has stopped and left a record: {reason} — {detail}"
    # 🔴 W44 · **A stop that stopped applying, because the extension changed.**
    #
    # A stored stop whose reason is a judgement about the extension itself is tied
    # to the capability it was judged against, and it stops applying when that
    # capability changes. This sentence is what a user sees instead of the leg
    # quietly starting again: what the record said, what it was a judgement about,
    # what this build can do, and when the leg started again.
    #
    # 🔴 It must never be the sentence for a stop still in force. Neither of those
    #    is true here: the stop is over, and nothing was lost while it stood
    #    (a stop about a capability fires before the request it is about).
    haltExpired: >-
      Backfill history for this platform: on {when} it was stopped by a record
      that said {reason}. That record was a judgement about what this extension
      itself could do, not about your account or the platform. It recorded
      {judgedAgainst}; this build records {capability}. So the record no longer
      applies and the leg started again on {cleared}, from the same place.
      Nothing was written off while it stood: a stop like this happens before the
      request it is about, so no conversation was passed over in the meantime.

  # 🔴 W44 · One capability value in words, for the sentence above. Both sides of
  # an expiry are named with these, because "judged against list-only, now full"
  # tells a reader nothing. Every value is a noun phrase: the sentence around them
  # reads "It recorded ..., this build records ...".
  capability:
    # What the extension could do when the record was written.
    none: no capability at all — it could not read this platform's conversation list
    listOnly: the conversation list only, with no way to fetch a conversation's body
    full: the conversation list and every conversation's body
    # 🔴 Not a capability: the record was written before stops said what they were
    # judged against. It must not read as "nothing was possible" — that is `none`,
    # and the two facts lead a reader to different conclusions.
    unmarked: nothing — that record was written before a stop said what it was judged against
    # A value this build does not recognise is printed as-is; never rounded into one of the above.
    other: "an unrecognised value ({capability})"

# ---------------------------------------------------------------------------
# The alarm's last tick — why it did nothing
# ---------------------------------------------------------------------------
tick:
  reason:
    noTargets: there are no backfill targets yet, so it does not know which platform or which account's history to fetch
    noHttpPort: no usable fetch channel (no open supported-platform page at the time)
    disabled: the switch was off at the time
    noStore: browser storage was unavailable at the time
    hostPaused: this machine's host is unreachable, so this leg paused until it answers
    alreadyRunning: the previous tick had not finished, so this one stepped aside
    ran: it ran
    unknown: "outcome code: {reason}"

# ---------------------------------------------------------------------------
# Progress (the only place a percentage may ever be produced)
# ---------------------------------------------------------------------------
progress:
  haltedPrefix: "[stopped: {reason}] "
  # 🔴 W13 · The other half of that sentence. A transient stop has NOT stopped the
  # leg, so it must not borrow `haltedPrefix`: this one says it is waiting, how many
  # attempts deep the streak is, and when it tries again. Nothing has been written off.
  retryPrefix: "[waiting to retry: {reason} (attempt {attempts}, about {minutes} min)] "
  unknownTotal: "Archived {archived}, still owed {pending}, total unknown ({reason})"
  withTotal: "Archived {archived} of {total} ({percent}%), still owed {pending}"
  # 🔴 W10 · The total was not missing, it was **wrong**: more rows came back
  # than it claims exist. So the line says what is actually known (how many have
  # been listed at least) and carries no percent sign — dividing by a number the
  # list endpoint has already contradicted would be a fabricated figure.
  withContradictedTotal: >-
    Archived {archived}, still owed {pending} — at least {listed} listed so far;
    the API's own total has already been exceeded by the rows actually returned,
    so it is not used as a denominator
  reason:
    noTotalFromApi: the API did not provide a total
    totalNotPositiveInt: total is not a usable positive integer
    totalExpired: the archived count exceeds total, so the denominator is stale
    totalContradicted: the API's total has already been exceeded by the rows actually listed

# ---------------------------------------------------------------------------
# Why one conversation was not stored
# ---------------------------------------------------------------------------
failure:
  notSaved: the body was fetched, but no file was written
  identityMismatch: it was written, but the identity used for the file name does not match this debt
  detailPagedUnsupported: >-
    the conversation came back incomplete — the platform holds more of it, and we
    do not fetch the rest — so nothing was stored
  detailTooLong: >-
    this conversation has more parts than we fetch in one go, so nothing was
    stored
  detailTreeIncomplete: >-
    the conversation came back only in part — following it back from its newest
    message reached a message the reply did not carry — so nothing was stored
  unknownReason: "reason code {reason}"
  shortIdEmpty: (empty)

# ---------------------------------------------------------------------------
# Per-platform coverage notes. These are written for the user: no jargon, and
# none of them may hint that the platform is being backfilled right now.
# ---------------------------------------------------------------------------
platformNote:
  perplexity:
    partial: >-
      Perplexity: past conversation bodies cannot be backfilled yet. Your past
      conversations can already be listed, but we do not fetch the content of
      each one yet, so for now not a single one will be stored.
