# Chinese (Simplified) catalog.
#
# 🔴 This is the only file under apps/extension where CJK characters are
#    allowed: scripts/check-terminology.py scans apps/extension for CJK and
#    skips this path on purpose.
#
# The wording of every entry that already existed in Chinese is carried over
# verbatim — the point of this file is to keep the same information, not to
# shorten it. Placeholders must match locales/en.yml one for one; a test
# (tests/i18n-catalog.test.ts) fails the build if they drift.
extName: Chat Stasher
extDescription: 把你选定的网页对话抓取到本机文件里。

common:
  unknownTime: 时间不详
  unknownTimeShort: 时间不详
  unknownSize: 大小不详
  # 🔴 W36b · 没有单位、也没有更长句子可承载时的「我不知道」，一字足矣。
  # 凡是期望显示数字的地方，都不用它。
  unknownShort: 不详

channel:
  noCheck: >-
    落盘通道：还没有任何一次主机检查跑过 —— 扩展一次都没有问过 chat-stasher
    host，所以它没有任何可报告的结论。
  connected: >-
    落盘通道：已连上 chat-stasher host —— stage {stage} · 机器 {machine} ·
    主机版本 {hostVersion}（询问时间 {at}）。
  disconnected:
    head: "落盘通道：【未连上】chat-stasher host —— 原因：{why}（询问时间 {at}）。"
    detail: " 详情：{detail}。"
    stageKnown: " 上一次知道的 stage：{stage}。"
    stageNever: " 这台机器上还从来没有学到过 stage 路径。"
    fix: " 修复：{command}"
  reason:
    unknown: 原因不明

outbox:
  empty: "发件箱：空的 —— 到目前为止每一条捕获都已经被主机确认。"
  head: "发件箱：{pending} 条待送，{rejected} 条被拒 —— 已占用 {bytes} / {capacity}。"
  full: >-
    发件箱已【满】：在主机取走已经排队的内容之前，新的捕获会被拒收。已经排队的
    一条都没有被删除。
  rejected: "被主机拒绝并保留（不会自动重试）：{kinds}。"
  sample: "  · {kind}：{detail}"
  noDetail: 没有记录详情
  unknownKind: 原因不明
  unreadable: >-
    发件箱：读不出来 —— 这个浏览器上下文里没有 IndexedDB，所以扩展答不上现在
    排队的是什么。没有任何东西被删除。

export:
  buttonLabel: 导出未送达的会话
  emptyNote: 没有可导出的：发件箱是空的，所以不存在未送达的会话。
  note: >-
    导出：最近一次写出于 {at} —— {entries} 条会话，{bytes}，文件名
    {filename}。被导出的会话仍然留在发件箱里：主机恢复可达之后会把它们按重复条
    确认掉。
  noHistory: "导出：还没有写出过任何导出文件。"
  nothingQueued: 没有可导出的。
  unreadable: 发件箱：读不出来 —— 这个浏览器上下文里没有 IndexedDB。没有生成任何导出文件。

backfill:
  paused:
    head: "回溯：已暂停 —— 本机 host 够不着（{reason}），首次发现于 {at}。"
    detail: " 详情：{detail}。"
    tail: >-
      仍然欠着的那些对话一条都没有动，等主机重新答话时会从停下的地方接着补。

badge:
  waiting: "{pending} 条捕获正在等 chat-stasher host"
  rejected: "{rejected} 条被主机拒绝"
  full: 发件箱已满，正在拒收新的捕获
  title: "chat-stasher：{parts}"
  unreadable: >-
    chat-stasher：这个浏览器上下文里读不出发件箱 —— 扩展答不上现在排队的是
    什么。没有任何东西被删除。

popup:
  buttonTag: "[按钮] {label}"
  toggle:
    label: 自动回溯历史对话
  clearFailures:
    label: 我知道了，清空这份清单
  startBackfill:
    label: 开始回溯这个平台
  locale:
    label: 语言
    auto: Auto
    english: English
    chinese: 中文
  summary:
    line: "{recent} · {total} · {push}"
    recent: "最近 {hours} 小时：{count} 条会话"
    recentNamed: "最近 {hours} 小时：{count} 条会话（{list}）"
    recentUnknown: "最近 {hours} 小时：不详"
    totalNamed: "stage 里共 {count} 条"
    totalUnknown: "stage 总数不详"
    harnessEntry: "{harness} {count}"
    harnessMore: "{list}，另有 {rest} 个"
    noHarness: "（没有 harness 前缀）"
    pushAgo: "上次推送 {ago}"
    pushUnknown: "上次推送时间不详"
    pushFuture: >-
      上次推送记录的时间是 {at}，这个时刻还没到 —— 说明系统时钟和记录对不上
    agoJustNow: 刚刚
    agoMinutes: "{count} 分钟前"
    agoHours: "{count} 小时前"
    agoDays: "{count} 天前"
    unasked: 阶段汇总：这个弹窗还没有问过 host，所以没有任何可数的东西。
    hostMissing: >-
      阶段汇总：chat-stasher host 没有回应，这里什么都数不出来。安装命令是
      `chat-stasher install-native-host --stage <你的 stage 路径>`，指向一个
      真实存在的目录。
    olderHost: >-
      阶段汇总：浏览器里装的那个 host 比这个扩展旧，它根本不认识汇总请求。
    olderHostNote: >-
      host 回答的是“unknown message type”，这是旧 host 表示不认识这个请求的
      方式。装上当前版本的二进制后重新执行 `chat-stasher install-native-host
      --stage <你的 stage 路径>`，然后重新打开这个弹窗。
    unavailable: "阶段汇总：host 没有回应（原因：{reason}）。"
    failedNote: "阶段汇总：host 没有回应 —— {detail}"
    noteTotal: "stage 总数为什么是不详 —— {why}"
    noteRecent: "上面那个窗口的条数为什么是不详 —— {why}"
    notePush: "上次推送时间为什么是不详 —— {why}"
  dashboard:
    label: 打开仪表盘
    opening: >-
      正在启动仪表盘… host 正在把它拉起来，在它回应之前按钮保持禁用 —— 再按一次
      会启动第二个。
    opened: "仪表盘已在新标签页打开。它运行期间那个 URL 就是密钥 —— 不要外传。"
    refusedUrl: >-
      没有打开任何标签页：host 回的地址不是 127.0.0.1 上的仪表盘 URL，所以这个
      扩展没有打开它。
    failed: "没有打开任何标签页：{detail}"
    reason:
      noAnswer: 打开仪表盘不可用：host 还没有回答过汇总请求，没有东西可以打开。
      hostMissing: >-
        打开仪表盘不可用：chat-stasher host 没有回应。安装命令是
        `chat-stasher install-native-host --stage <你的 stage 路径>`。
      olderHost: >-
        打开仪表盘不可用：装着的 host 比这个扩展旧，不认识这个请求。装上当前
        版本的二进制后重新执行 `chat-stasher install-native-host --stage
        <你的 stage 路径>`。
      failed: "打开仪表盘不可用：{detail}"
  status:
    hostPaused: 状态：开关是开的，但本机 host 够不着，回溯已自动暂停（欠账一条没动）
    on: 状态：开关是开的
    off: 状态：开关是关的（这是默认值，需要你手动打开）
  running:
    noStore: 运行：未在运行 —— 浏览器存储不可用。
    disabled: 运行：未在运行 —— 开关没有打开。
    hostPaused: >-
      运行：未在运行 —— 本机 host 够不着，已经暂停；欠账原封不动地留着，下一次
      心跳会先问一次主机在不在，答话了就从同一笔接着做。
    noTargets: >-
      运行：未在运行 —— 开关已经打开了，但还没有任何回溯目标，所以闹钟每次醒来
      都无事可做，一条也没有在取。下面那一行写了你要做的那一件事。
    noHttpPort: >-
      运行：未在运行 —— 开关已经打开了，但此刻没有可用的取数通道，一条也没有
      在取。
    active: >-
      运行：正在归档 —— 大约每 {minMinutes} 到 {maxMinutes} 分钟自动取一批历史
      对话，间隔刻意不固定（不是固定周期）；每天最多 {maxPerDay} 笔，每笔之间至少
      隔 {minIntervalSeconds} 秒。
  missing:
    noStore: >-
      缺：browser.storage.local。没有持久化就没有可断可续，与其每次重启都从头
      爬一遍，不如不跑。
    noHttpPort: >-
      缺：一个开着的、已登录的受支持平台页面 —— 取数通道要借它才能建立。历史
      对话只在你自己的浏览器页面里取（同源请求，用的是你本来就有的登录态），
      所以只要没有任何受支持平台的标签页开着，这条腿就取不到数。打开其中任意
      一个平台的页面并保持开着，它就会自己继续。
    noTargets:
      buttonHint: |-
        你现在也可以直接按这段话下面那个「{button}」按钮 ——
        那等于你明确说了「就补这个平台」，我们才会把它记成回溯目标。（我们仍然不猜你的账号：那份归档范围会记成 default，等你真的被归档过一次之后，那个真实账号会另记一份。）
      body: |-
        缺：一次真的被归档过的对话 —— 回溯要从它身上才知道该补哪个平台、哪个账号的历史。
        你现在要做的一件事：在这个平台上发一条消息，或者打开一条你已有的对话，让它被【实时归档】一次（照常交给你本机的 chat-stasher）。捕获到那一次之后，我们才会记下这个平台和这个账号，回溯就从那个账号开始往回补。
        🔴 为什么非得先有这一次：我们不猜你的账号，只用你真的用过的那一个。这个扩展没有任何 host 权限，历史只在你自己已经打开、已经登录的页面里取；在你真的用过一次之前，我们既不会去猜一个账号，也不会把整个平台的会话都翻一遍。
        （补完要多久取决于你自己有多少历史、页面开着多久 —— 这里不给时间承诺，进度会一笔一笔显示在下面。）
    hostPaused: >-
      缺：本机那个 chat-stasher host 答不上话。它由 `chat-stasher
      install-native-host --stage <你的 stage 路径>` 装好并指向一个存在的目录；
      装好之后这条腿会自己恢复（心跳会先问一次主机在不在），不需要你手动点任何
      东西。
  failures:
    head: "🔴 失败：有 {count} 条历史对话取到了正文、但【没有存下来】，而且【不会自动再试】。"
    headDropped: "🔴 失败：有 {count} 条历史对话取到了正文、但【没有存下来】，而且【不会自动再试】。（清单最多留 {max} 条，另有更早的 {dropped} 条已经不在清单里。）"
  failureNote:
    title: "这几条没有存下来（按时间从新到旧）："
    row: "· {platform} · 会话 {shortId}… · {reason} · {at}"
    retry: >-
      🔴 它们不会被自动重试 —— 这是刻意的：同一个出口刚刚已经失败过一次，
      闷头再试一遍只会把同一个失败重复一遍，还会让你以为它已经好了。
    ledger: >-
      欠账账本上它们既不算「已归档」也不再排队，所以进度里的数字没有把它们
      冒充成成功。
    clear: 清空这份清单只是「我知道了」，不会触发任何重新抓取。
  lastTick:
    none: >-
      闹钟：存储里还没有任何一次闹钟跳动的记录 —— 可能它还没醒过第一次。
      （这一条是照实说「我不知道」，不是「它没在跑」。）
    ran: >-
      闹钟：最近一次醒来是 {when}，那一跳真的跑了（登记表里有 {targets} 个
      回溯目标）。
    skipped: >-
      闹钟：最近一次醒来是 {when}，那一跳【什么都没做】——{reason}
      （当时登记表里有 {targets} 个回溯目标）。
    # 🔴 W36b · 【跑了】不等于【跑出结果】。第一次真机验收读到的就是
    # 「ran: true」配上一个纹丝未动的存储布局；这一行补上缺的那一半 ——
    # 这一跳自己的停止原因，以前在写进存储之前就被丢掉了。
    halted: >-
      而且那一跳并没有跑完就停住了：{reason}。技术细节：{detail}
    ledgerMismatch: >-
      而且那一跳【拒绝取任何东西】：这个平台的进度记录里列着的对话，欠账存储里
      已经一条都没有了，没有欠账集合可以往下清。没有任何一笔被销账，这条腿也试着
      把这个范围重置成从头重新列一遍 —— 下面这段细节写了它记下了什么、以及有没有
      成功。技术细节：{detail}
    # 🔴 W62b · 【这一跳还没跑完时写下的记录，不是对它的结论】，所以这句是
    # 换掉开头那句、而不是接在它后面：「那一跳什么都没做」对一个写下记录时
    # 还在跑的一跳是错的。能读到这一行，就说明最近一次醒来没有跑完 ——
    # worker 被回收了、查标签页那一步抛错了、或者这一跳自己的记录没写进去 ——
    # 所以照实说出来，而不是留空。它不报任何结果，因为那一刻本来就没有结果。
    unfinished: >-
      闹钟：最近一次醒来是 {when}，写下这条记录时那一跳【还没有跑完】—— 它当时还在
      查有没有开着的标签页能替它取数据（当时登记表里有 {targets} 个回溯目标）。
      所以这是它【跑着的时候】的状态，不是对它的结论：这里没有说它找不到通道，
      也没有说它没找过。如果下一次醒来还没有把这一行换掉，那就说明那次醒来也没跑完。
  progress:
    notStarted: >-
      进度：还没有开始 —— 存储里还没有这个平台的欠账集合，也就是说一条都还没有
      枚举过。
    line: "进度：{progress}"
  coverage:
    all: "回溯覆盖：目前支持的平台（{yes}）都能补历史对话。"
    partial: >-
      回溯覆盖：现在只有 {yes} 能补回历史对话；{no} 【还不能】。它们的实时归档
      照常工作（你正在看的那条对话仍然会被存下来），只是过去的历史暂时补不回来
      —— 这不是坏了，也不是你没有历史，是我们还没学会读它们的历史列表。
    noteTitle: 这些平台暂时补不回历史，各自卡在哪一步：
    noteWhy: >-
      🔴 我们不会为了让它「看起来在动」而去猜一个接口地址：猜错的结果不是报错，
      而是你以为历史在补、实际上一条都没补。宁可在这里明说还不支持。
  notes:
    target: "这份进度对应：平台 {platform} · 归档范围 {scope}"
    noTarget: 还没有任何平台的回溯记录，所以这里没有可显示的归档范围。
    # 🔴 W54b · 目标注册表的逐出记录（alarm.ts，cs_backfill_evicted_v1）——
    # 注册表容量上限的持久收据。只陈述事实：每个离开的席位，新的在前，
    # 原因用文字写明。范围值与上面"这份进度对应"一行打印的是同一类值
    # （账号/组织标识，绝不是会话标题）。dropped 一行只在收据自己的上限
    # 挤掉过更早记录时才出现——绝不做无声截断。
    evictions:
      title: >-
        回溯目标注册表：记录中有 {count} 次逐出。注册表最多保留 {max}
        个目标；失去席位的目标会停止回溯，直到新的捕获再次登记它；
        每个被逐出的席位都连同该范围的本地进度标头一起离开，
        不留下任何被隐藏的东西（新的在前）：
      row: "· 平台 {platform} · 归档范围 {scope} · {reason} · {when}"
      dropped: >-
        （另有 {count} 次更早的逐出已不在这份最多保留最近 {kept}
        条的记录上。）
      reason:
        registryCap: "因目标注册表已满而被逐出"
        other: "因未识别的原因被逐出：{reason}"
    # 🔴 W36b · 存储里发现的 W18 之前的旧布局，就地说清楚。
    # 下面两句【不是】同一句话，差别正是要点：moved 是已经修好的事实，
    # refused 是旧记录还攥着你的 id、而这条腿不会去动它。
    legacy:
      moved: >-
        存储布局：这一页在显示任何东西之前，先把 {count} 条更早（W18 之前）的
        回溯记录搬到了当前布局，所以上面显示的是它现在的样子。什么都不会丢：
        旧记录只有在内容写入并读回校验之后才会被删除。
      refused: >-
        存储布局：发现了 {found} 条更早（W18 之前）的回溯记录，其中只搬动了
        {moved} 条。剩下的还原样留在存储里，这条腿不会拿它们去跑 —— 里面的 id
        是你的，不会被丢掉。原因：{reason}。技术细节：{detail}
    hook:
      observed: >-
        {origin}（平台：{platform}）在 {when} 报告：{reasons}。
      capture:
        recorded: >-
          这个平台的实时抓取记录：最近一次确认它的一份抓取已在你的归档里是在
          {captureWhen}，另有 {count} 条是新存进归档的。页面如果再送来一份内容没变的
          抓取，说明那一份本来就在你的归档里，所以它只会把上面的时间往前推，不会让这个
          数字变大。
        noneRecorded: >-
          这个平台的实时抓取记录：什么都没有。这里从来没记下过它的一条抓取——这是
          记录上的一段空白，不是「一条都没来过」的测量结果。
      verdict:
        working: >-
          所以这个平台的实时抓取是正常工作的：一条对话进了你的归档，就说明整条链路
          被实测走通了，而且它不比 {since} 更旧——那是上面那次观察开始的时刻。
        notWorking: >-
          我们的钩子在那个页面里不生效，而上面那份记录里，这个平台在这次观察
          之后没有任何抓取记录——所以你在那里打开的对话不会被归档。刷新标签页是
          从该页面拿到新观察的办法；在那里存下来一条对话，就是能把这件事说定的证据。
        unknown: >-
          那里的抓取是否还能用，目前未知。观察到的是钩子在页面里的位置变了，而接管
          这个位置的页面或另一个扩展通常会继续调用它替换掉的那一份——所以仅凭这一
          点不能断定抓取停了；而上面那份记录里，这个平台在这次观察之后也没有任何
          抓取记录，因而无法定论。刷新标签页是从那个页面拿到新观察的办法；在那里
          存下来一条对话，才能把这件事说定。
      reason:
        didNotRun: 那个页面里根本没有我们的钩子跑起来
        didNotTake: 钩子跑起来了，但页面自己的全局对象拒绝了它打的补丁
        wasReplaced: 钩子装上了，之后页面把这个全局对象拿回去了
      declinedOrigin: >-
        {origin} 报告了它自己那个实时抓取钩子的情况，但没有被记下来：这个扩展不是
        为那个站点做的，不会往那里装抓取钩子，也就不会说它装过。这个页面自己的报告
        确实送到了扩展，时间截至 {when}。同一条报告连续被拒绝次数：{count}。
      declinedMessage: >-
        有个页面发来一条实时抓取报告，当前这个版本读不懂，所以没有从它记下任何东西。
        报告送到的时间是 {when}；是哪个页面发的、它观察到了什么，正是没通过检查的那
        部分。同一条报告连续被拒绝次数：{count}。
      declinedOther: >-
        有个页面的实时抓取报告在 {when} 送到了，但没有被记下来（{reason}）：
        当前这个版本不认识这个原因代码。同一条报告连续被拒绝次数：{count}。
    whatOpening: >-
      打开之后会做什么：只要有一个受支持平台的页面开着，就在后台悄悄补历史对话，
      间隔刻意不固定，大约每 {minMinutes} 到 {maxMinutes} 分钟取一批，用的是你
      自己那个页面的登录态；每天最多 {maxPerDay} 笔，好几天里慢慢补完。关掉即停
      （定时器也会一并清掉）。
    relisted: >-
      这个平台的历史回溯：{when} 发现它的进度记录里列着 {recorded} 条对话 id，
      而存储里的欠账集合只剩 {held} 条。已经补过哪些的记录无法恢复，所以对话列表
      是从头重新列了一遍，这些对话会再走一遍。你的归档里没有被删掉任何东西。
    halted:
      unsupportedPlatform: >-
        这个平台（{platform}）的历史回溯还没有实现，所以这条腿在发出任何请求
        之前就停住了。这不是平台改版，也不是被限流。技术细节：{detail}
      detailUnsupported: >-
        这个平台（{platform}）的历史会话【已经列出来了】（{pending} 条在等着），
        但取每条对话正文的那一步还没有实现，所以这条腿在取第一条正文之前就停住
        了，目前一条也没有存下来。这不是平台改版，也不是被限流；列出来的这些会
        一直留着，等那一步补上就接着往下清。技术细节：{detail}
      orgAmbiguous: >-
        这个 Claude 账号同时属于好几个组织，页面上也没有任何信息能说明该回溯哪一个
        —— 所以这条腿在发出任何请求之前就停住了。请在你想要归档的那个组织里打开一次
        对话，它就会认准那一个。
      orgUnresolved: >-
        这条腿在发出任何请求之前就停住了：它没法确定这个账号正在用的是哪个 Claude
        组织。打开一次 Claude 对话，它就能找到你的组织。
      # W61 · 与 waitingRetry 的区别是【为什么】：那是限流，这是登录凭证，所以
      # 句子不同。W61b 补了两处：这个 reason 现在是 transient，所以句子必须说
      # 【它会自己再来问】；另外删掉了「被拒绝的就是列列表这个请求本身」——同一个
      # reason 在 body 那一腿上也会印这句，而那时列表早就读过了、欠账都在 pending
      # 里，那句话在最该看它的状态下反而是假的。
      authRefused: >-
        这条腿停下来了，而且这不是平台改版：{platform} 拒绝了一次请求，并在自己的
        回复里说明了原因（{detail}）。在这个平台上实测到的拒绝都是登录凭证缺失或
        已失效，所以解决办法是在这个浏览器里打开 {platform} 重新登录 —— 而且只需要
        这一步：这条腿会自己接着来问，大约 {minutes} 分钟后（本轮第 {attempts} 次），
        重新登录会被它自己接上。这条记录立着的时候，没有任何一条对话被数漏、跳过或
        销账：被拒绝的请求不会记录任何东西，已经读到的原样留着，没读到的还是没读到。
      # W61b · 同一个 in-band 拒绝，但 code 这个版本读不懂。它必须不猜：用
      # waitingRetry 会把「为什么」说成平台「拒绝或掐断了请求」，而没人证实过；
      # 用上面的 authRefused 会说出平台根本没提过的登录问题。
      refusedUnknown: >-
        这条腿停下来了，而且这不是平台改版：{platform} 在自己的回复里拒绝了一次
        请求，用的 code 是这个版本不认识的（{detail}）。这个 code 是什么意思，这里
        并不知道 —— 既不当作登录问题，也不当作平台改版 —— 所以这条腿不猜：它会自己
        再来问，大约 {minutes} 分钟后（本轮第 {attempts} 次）；平台自己的 code 和
        消息就在这条记录里，下一个读它的人拿到的是证据而不是猜测。这条记录立着的
        时候，没有任何一条对话被数漏、跳过或销账：被拒绝的请求不会记录任何东西，
        这条腿原本欠着的账也一条都还欠着。
      waitingRetry: >-
        这条腿【没有停下】，也没有销掉任何一笔账：平台拒绝或掐断了这次请求
        （{reason}），所以它在等自己的退避时间过去，之后会自己接着往下走 ——
        还是从原来那个位置，大约 {minutes} 分钟后。这是这一串连续失败的第
        {attempts} 次；如果这个数字一直往上涨，那就说明平台是真的不高兴，而不是
        一时够不着。技术细节：{detail}
      other: "这条腿已经停下并留痕：{reason} —— {detail}"
    haltExpired: >-
      这个平台的历史回溯：{when} 它被一条说要 {reason} 的记录停住了。那条记录说的
      是这个扩展自己当时能做什么，而不是你的账号或平台本身。它记下来的是
      {judgedAgainst}；当前这个版本记下来的是{capability}。所以那条记录不再适用，
      这条腿已经在 {cleared} 自己接着往下走了 —— 还是从原来那个位置。它停着的那段
      时间里没有销掉任何一笔账：这类停住发生在它要发的那次请求之前，所以中间没有
      任何一条对话被跳过。
    # 🔴 W59 · **停住的那条记录是另一个版本写下的，所以它不再适用。**
    #
    # 每一条「永久停住」都是某一个版本对它当时看到的东西做的判断 —— 平台的回应、
    # 你的账号、或者这个扩展自己记下的进度。没有看到过任何东西的版本，就没有做过这个
    # 判断，所以这条记录只会被重新判一次：这条腿会跑起来；如果同样的东西又把它停住，
    # 新那条记录会写上看见它的这个版本，于是就会一直生效。
    #
    # 🔴 这句话【绝不能】用上面那条「能力」的话：那条讲的是扩展能做什么。这里变的不是
    #    扩展的能力，而是「正在问的是哪个版本」。两句话各自只能用在配得上它的记录上。
    haltExpiredBuild: >-
      这个平台的历史回溯：{when} 它被一条说要 {reason} 的记录停住了。那条记录是
      {build}写下的，而当前这个版本是 {currentBuild}。停住是某一个版本对它当时看到的
      东西做的判断 —— 平台的回应、你的账号、或者这个扩展自己记下的进度 —— 没有看到过
      任何东西的版本，就没有做过这个判断。所以那条记录被重新判了一次，这条腿已经在
      {cleared} 自己接着往下走了 —— 还是从原来那个位置：该还的对话还是那些，游标也
      没动，没有销掉任何一笔账。如果同样的东西又把它停住，那条新记录会写上当前这个
      版本，然后就会一直生效。
  # 🔴 W44 · 上面那句话里的「能力取值」用词。取值都是名词短语，句子读起来是
  # 「它记下来的是……，当前这个版本记下来的是……」。
  capability:
    none: 完全没有能力 —— 连这个平台的对话列表都读不了
    listOnly: 只能读对话列表，还没有取单条对话正文的办法
    full: 能读对话列表，也能取每一条对话的正文
    # 🔴 这不是一种能力：那条记录写在「停下时要写明依据什么」这件事存在之前。
    # 不能读成「当时什么都做不了」—— 那是 none，两者会让读者得出不同的结论。
    unmarked: 什么都没有 —— 那条记录写在「停下时写明依据什么」这件事存在之前
    other: "一个本版本不认识的取值（{capability}）"
  # 🔴 W59 · 版本号取值里唯一不是版本号的那一个，用文字说明。真版本号原样打印
  # （chrome://extensions 里显示的就是它），只有这个哨兵值需要一句话。
  build:
    # 🔴 不能读成「更旧的版本」或「未知版本」：记录也可能由更新的版本写下（降级、
    # 另一个配置文件），能确定的只是「那条记录没有写出版本号」，不是「是哪个版本」。
    unstamped: 一条没有写出版本号的记录（它写在「停下时写明是哪个版本做的判断」这件事之前）

tick:
  reason:
    noTargets: 还没有任何回溯目标，不知道该补哪个平台、哪个账号的历史
    noHttpPort: 没有可用的取数通道（当时没有一个开着的受支持平台页面）
    # 🔴 W76 · 不是通道问题，也不是没有目标：目标在，但这一次一个都跑不了
    # （被停止记录挡着，或者正在退避等待里）。
    noRunnableTarget: 有目标，但这一次没有一个跑得了
    # 🔴 W76b · 这一跳不是空转：它问了平台该读哪个账号（账号范围还没定），
    # 而那一次请求就是这一跳的全部。
    scopeAsked: 问了平台该读哪个账号，这一跳就到此为止
    disabled: 开关当时是关的
    noStore: 浏览器存储当时不可用
    hostPaused: 本机 host 够不着，这条腿在等到它答话之前暂停了
    alreadyRunning: 上一跳还没结束，这一跳直接让路了
    ran: 它跑了
    unknown: "结局码：{reason}"

  # 🔴 W113 · **某个目标这一跳为什么没跑** —— `TickSchedule.skipped` 里的码，说成人话。
  # 这里的键是驼峰，记录里是连字符；映射在 lib/coverage.ts 的 `describeSkipReason`，
  # 认不出来的码走 unknown，而不是拿码去拼键名。
  skip:
    noHttpPort: 当时没有这个平台的页面开着，没有可以取数的通道
    halted: 这个平台被一条仍然生效的停止记录挡着
    waitingRetry: 这个平台被拒之后正在退避等待，它自己会再来问
    dailyCap: 这个平台今天的正文额度已经用完了
    stateUnreadable: 这个平台保存的进度记录读不出来，所以原样没动
    unknown: "这个 build 不认识的跳过原因：{reason}"

progress:
  haltedPrefix: "[已停止：{reason}] "
  retryPrefix: "[等待重试：{reason}（第 {attempts} 次，约 {minutes} 分钟后）] "
  unknownTotal: "已归档 {archived} 条，欠账 {pending} 条，总数未知（{reason}）"
  withTotal: "已归档 {archived} / 共 {total} 条（{percent}%），欠账 {pending} 条"
  withContradictedTotal: >-
    已归档 {archived} 条，欠账 {pending} 条 —— 目前至少已列出 {listed} 条；
    接口自报的 total 已经被实际返回的行数超过，所以不用它当分母
  reason:
    noTotalFromApi: 接口未提供 total
    totalNotPositiveInt: total 不是可用的正整数
    totalExpired: 已归档数超过 total，分母已过期
    totalContradicted: 接口自报的 total 已经被实际列出数超过

failure:
  notSaved: 取到了正文，但没有写出任何文件
  identityMismatch: 写出去了，但用的文件名身份和这条欠账对不上
  detailPagedUnsupported: >-
    这条会话只回来了一部分——平台那边还有，我们不取剩下的——所以什么都没有存
  detailTooLong: >-
    这条会话比我们一次取的部分多，所以什么都没有存
  detailTreeIncomplete: >-
    这条会话只取回了一部分——从最新一条往回追，追到一条这次回复里没有的消息——所以什么都没有存
  detailEmpty: >-
    这条会话取回来是空的，什么都没有存
  detailUnverified: >-
    这条会话没能证明自己完整——回复里的结束信号缺失、为空或类型不对，或者某条没有可读内容——所以什么都没有存
  unknownReason: "理由码 {reason}"
  shortIdEmpty: "（空）"

# platformNote: W84 起不再有半程声明的平台，注释块留空；若未来有 partial 平台，集中在这里。


# ---------------------------------------------------------------------------
# ADR-032 · 覆盖页（独立扩展页）与弹窗摘要卡。
# ---------------------------------------------------------------------------
coverage:
  title: 回溯覆盖情况
  subtitle: >-
    以下是扩展自己记录下来的内容，读取时间 {when}。这个页面只读本浏览器自己的进度记录——
    它不向任何平台发请求；归档自己的视图是 `chat-stasher ui` 命令。
  empty: >-
    还没有任何进度记录。这不等于「什么都没归档」——它的意思是这个浏览器还没有回溯过任何平台，
    第一次在开关打开的情况下打开某个受支持平台时才会出现。
  state:
    off: >-
      回溯开关是关的。在你于扩展弹窗里打开它之前，不会取任何东西，也不会发出任何请求。
    hostPaused: >-
      本机的 chat-stasher host 够不着，所以这条腿暂停了，而不是去取它送不出去的正文。
      启动 host 之后，它会从同一条对话继续。
    haltedNoRecord: >-
      这里记着一次停止，但记录本身读不出来，所以原因未知。在看清楚之前不会取任何东西。
    unregistered: >-
      {platform} 有进度记录，但没有已注册的目标，所以这里不会运行。再打开一次 {platform} 就会重新注册。
    capped: >-
      这个平台今天的额度已经用完了（{cap} 条），这是限速在按预期工作，不是故障。明天它会自己继续。
    waiting: "此刻没有在跑：{why}。"
    done: 这个平台列出来的对话都已经存下了。
  counts:
    fromHeader: >-
      存欠账的那份清单读不出来，所以下面的「已存」「待存」是进度头里记下的数字——
      那是方便读的副本，不是权威。清单本身没有被改动。
  enum:
    complete: "已列出：{listed} —— 这个列表已经读到末尾"
    inProgress: "仍在列出：目前 ≥ {listed}"
    # 🔴 W113b · truncated 和 inProgress 一样是「没列完」，所以数字也要带 ≥（ADR-032 §1：未列完时必须带 ≥）。
    #    原文说「没有读到末尾」而数字却是裸的——那正是「把下限画成总数」的形状。
    truncated: "已列出：目前 ≥ {listed}，并且这个列表【没有】读到末尾 —— {why}"
    why:
      cursorMissing: 平台的回复里没有带翻页游标，所以只列出了拿到的那一页
      hasMoreMissing: 平台的回复没有说还有没有下一页，所以我们停下，而不是去假设
      emptyPageInferred: 这个平台没有明确的「列表结束」信号，而它返回了一个空页——那是推断，不是确认
      shortPageInferred: 这个平台没有明确的「列表结束」信号，而它返回了一个不满的页——那是推断，不是确认
      unknown: "列表停下的原因是这个 build 不认识的：{kind}"
  totals:
    label: "总数（平台自己报的）"
    # 🔴 W113b · ADR-032 §2 要的是「总数从哪来」，这句就只说这件事：这是平台自己报的数，不是对账号的测量。
    #    原文开头那句「至少见上；」是早先草稿的残句，上文里并没有可指的东西。
    fromResponse: "平台自报的总数是 {total}"
    unknown: 这个平台不提供这个列表的总数，所以没有分母
    contradicted: >-
      平台自报的总数已经被实际返回的行数超过了，所以不拿它当分母
  labels:
    archived: 已完整存下
    archivedOf: "{archived} / 已列出 {total}（{percent}%）"
    noPercent: "没有百分比：{reason}"
    pending: 仍欠
    percent: "占已列出的对话"
    failures: 没有存下的（按原因）
    failuresDropped: "这份列表里较早的 {count} 条已被丢弃（它是有上限的）"
    parked: >-
      被搁置：它们的正文回来是空的，而且还没有任何东西证明这个平台仍然会返回对话
    emptyStreak: "连续空正文：{count}"
    relisted: >-
      这个平台存下的对话列表在 {when} 被重新读过一遍：记录里写着 {recorded} 个对话 id，
      而存下的欠账清单只持有 {held}。你的归档没有被删除；并且一条已经存过的对话和一条从没取过的
      对话无法分辨。
    never: 从不
  speed:
    noCap: "当前没有生效的每日上限（这个计划不取正文）。"
    cap: "今天生效的每日上限：{cap} 条，每次唤醒最多 {tick} 条。"
    measured: "今天到目前为止实测：约 {rate}/天（{bodies} 条，用了 {hours} 小时）"
    measuredUnknown: "实测速度：今天过去的时间还不够发这个数（今天过了 {hours} 小时）"
    eta: >-
      估算：约需 {days} 天跑完仍欠的 {pending} 条（按{basis}）——这是估算，不是承诺：
      它假设这条腿会一直取下去
    etaUnknown: >-
      估算：没有——还没有可以拿来除的速度，因为既没有生效的额度，也没有可用的实测速度
    etaNothingOwed: 估算：这里没有欠账，也就没有「跑完」可言
    # 🔴 W113b · 没有注册目标的 scope 什么都不跑，所以没有估算可给。这句话必须点明原因：
    # 旁边两句，一句是「有速度可除」，另一句是「还没有速度可除」——读者要能分辨哪一行真的会跑完。
    etaUnregistered: >-
      估算：没有——这里没有为这个平台跑任何东西，仍欠的 {pending} 条要等它重新注册之后才会被取
    etaHours: >-
      估算：还需 {hours} 小时才能跑完仍欠的 {pending} 条（按{basis}）——这是估算，不是承诺：
      它假设这条腿会一直取下去
    basisMeasured: 今天实测的速度
    basisCap: 每日上限
    neverFetched: 还没有取过任何正文
    lastBody: "最近一次取正文在 {minutes} 分钟前"
  # 🔴 弹窗里的摘要卡。只有计数和状态词——不出现百分比，也不出现估算：
  # 那些需要页面上的说明，两行卡片承载不了。
  card:
    open: 打开覆盖页
    title: 覆盖情况
    line: "{platform} · {scope} · 已存 {archived}、欠 {pending} —— {state}"
    running: 正在跑
  months:
    title: 对话是什么时候的
    note: >-
      按平台自己的列表给每条对话的时间统计，用的是本浏览器的日历。平台没有给出时间的月份单独计在
      下面，【不会】摊到上面的月份里——没有记到时间不等于属于某个月。
    archived: 已存
    pending: 待存
    unknownTime: >-
      时间未知：已存 {archived} 条、待存 {pending} 条——平台的列表没有给出它们的时间，
      所以它们不在上面任何一个月里
    none: >-
      这里还没有任何一条对话记下了时间，所以没有月度分布可看。这不是「历史是空的」——
      只是时间还没有被记录。
  preset:
    title: 速度
    gentle: 温和（默认）
    standard: 标准
    faster: 加速
    risky: >-
      加速会抬高每天、每次唤醒取多少。它不改变两个请求之间靠得多近，每一段间隔也仍然是不规则的——
      但它确实是这里唯一一个对平台要求更高的设置，所以它不是默认。
    failed: "速度设置没能保存（{detail}），所以什么都没有变。"
    what: "每天最多 {cap} 条，每次唤醒 {tick} 条"
