# Chinese (Simplified) catalog.
#
# 🔴 This is the only file under apps/extension where CJK characters are
#    allowed: scripts/check-terminology.py scans apps/extension for CJK and
#    skips this path on purpose.
#
# The wording of every entry that already existed in Chinese is carried over
# verbatim — the point of this file is to keep the same information, not to
# shorten it. Placeholders must match locales/en.yml one for one; a test
# (tests/i18n-catalog.test.ts) fails the build if they drift.
extName: Chat Stasher
extDescription: 把你选定的网页对话抓取到本机文件里。

common:
  unknownTime: 时间不详
  unknownTimeShort: 时间不详
  unknownSize: 大小不详
  # 🔴 W36b · 没有单位、也没有更长句子可承载时的「我不知道」，一字足矣。
  # 凡是期望显示数字的地方，都不用它。
  unknownShort: 不详

channel:
  noCheck: >-
    落盘通道：还没有任何一次主机检查跑过 —— 扩展一次都没有问过 chat-stasher
    host，所以它没有任何可报告的结论。
  connected: >-
    落盘通道：已连上 chat-stasher host —— stage {stage} · 机器 {machine} ·
    主机版本 {hostVersion}（询问时间 {at}）。
  disconnected:
    head: "落盘通道：【未连上】chat-stasher host —— 原因：{why}（询问时间 {at}）。"
    detail: " 详情：{detail}。"
    stageKnown: " 上一次知道的 stage：{stage}。"
    stageNever: " 这台机器上还从来没有学到过 stage 路径。"
    fix: " 修复：{command}"
  reason:
    unknown: 原因不明

outbox:
  empty: "发件箱：空的 —— 到目前为止每一条捕获都已经被主机确认。"
  head: "发件箱：{pending} 条待送，{rejected} 条被拒 —— 已占用 {bytes} / {capacity}。"
  full: >-
    发件箱已【满】：在主机取走已经排队的内容之前，新的捕获会被拒收。已经排队的
    一条都没有被删除。
  rejected: "被主机拒绝并保留（不会自动重试）：{kinds}。"
  sample: "  · {kind}：{detail}"
  noDetail: 没有记录详情
  unknownKind: 原因不明
  unreadable: >-
    发件箱：读不出来 —— 这个浏览器上下文里没有 IndexedDB，所以扩展答不上现在
    排队的是什么。没有任何东西被删除。

export:
  buttonLabel: 导出未送达的会话
  emptyNote: 没有可导出的：发件箱是空的，所以不存在未送达的会话。
  note: >-
    导出：最近一次写出于 {at} —— {entries} 条会话，{bytes}，文件名
    {filename}。被导出的会话仍然留在发件箱里：主机恢复可达之后会把它们按重复条
    确认掉。
  noHistory: "导出：还没有写出过任何导出文件。"
  nothingQueued: 没有可导出的。
  unreadable: 发件箱：读不出来 —— 这个浏览器上下文里没有 IndexedDB。没有生成任何导出文件。

backfill:
  paused:
    head: "回溯：已暂停 —— 本机 host 够不着（{reason}），首次发现于 {at}。"
    detail: " 详情：{detail}。"
    tail: >-
      仍然欠着的那些对话一条都没有动，等主机重新答话时会从停下的地方接着补。

badge:
  waiting: "{pending} 条捕获正在等 chat-stasher host"
  rejected: "{rejected} 条被主机拒绝"
  full: 发件箱已满，正在拒收新的捕获
  title: "chat-stasher：{parts}"
  unreadable: >-
    chat-stasher：这个浏览器上下文里读不出发件箱 —— 扩展答不上现在排队的是
    什么。没有任何东西被删除。

popup:
  buttonTag: "[按钮] {label}"
  toggle:
    label: 自动回溯历史对话
  clearFailures:
    label: 我知道了，清空这份清单
  startBackfill:
    label: 开始回溯这个平台
  locale:
    label: 语言
    auto: Auto
    english: English
    chinese: 中文
  summary:
    line: "{recent} · {total} · {push}"
    recent: "最近 {hours} 小时：{count} 条会话"
    recentNamed: "最近 {hours} 小时：{count} 条会话（{list}）"
    recentUnknown: "最近 {hours} 小时：不详"
    totalNamed: "stage 里共 {count} 条"
    totalUnknown: "stage 总数不详"
    harnessEntry: "{harness} {count}"
    harnessMore: "{list}，另有 {rest} 个"
    noHarness: "（没有 harness 前缀）"
    pushAgo: "上次推送 {ago}"
    pushUnknown: "上次推送时间不详"
    pushFuture: >-
      上次推送记录的时间是 {at}，这个时刻还没到 —— 说明系统时钟和记录对不上
    agoJustNow: 刚刚
    agoMinutes: "{count} 分钟前"
    agoHours: "{count} 小时前"
    agoDays: "{count} 天前"
    unasked: 阶段汇总：这个弹窗还没有问过 host，所以没有任何可数的东西。
    hostMissing: >-
      阶段汇总：chat-stasher host 没有回应，这里什么都数不出来。安装命令是
      `chat-stasher install-native-host --stage <你的 stage 路径>`，指向一个
      真实存在的目录。
    olderHost: >-
      阶段汇总：浏览器里装的那个 host 比这个扩展旧，它根本不认识汇总请求。
    olderHostNote: >-
      host 回答的是“unknown message type”，这是旧 host 表示不认识这个请求的
      方式。装上当前版本的二进制后重新执行 `chat-stasher install-native-host
      --stage <你的 stage 路径>`，然后重新打开这个弹窗。
    unavailable: "阶段汇总：host 没有回应（原因：{reason}）。"
    failedNote: "阶段汇总：host 没有回应 —— {detail}"
    noteTotal: "stage 总数为什么是不详 —— {why}"
    noteRecent: "上面那个窗口的条数为什么是不详 —— {why}"
    notePush: "上次推送时间为什么是不详 —— {why}"
  dashboard:
    label: 打开仪表盘
    opening: >-
      正在启动仪表盘… host 正在把它拉起来，在它回应之前按钮保持禁用 —— 再按一次
      会启动第二个。
    opened: "仪表盘已在新标签页打开。它运行期间那个 URL 就是密钥 —— 不要外传。"
    refusedUrl: >-
      没有打开任何标签页：host 回的地址不是 127.0.0.1 上的仪表盘 URL，所以这个
      扩展没有打开它。
    failed: "没有打开任何标签页：{detail}"
    reason:
      noAnswer: 打开仪表盘不可用：host 还没有回答过汇总请求，没有东西可以打开。
      hostMissing: >-
        打开仪表盘不可用：chat-stasher host 没有回应。安装命令是
        `chat-stasher install-native-host --stage <你的 stage 路径>`。
      olderHost: >-
        打开仪表盘不可用：装着的 host 比这个扩展旧，不认识这个请求。装上当前
        版本的二进制后重新执行 `chat-stasher install-native-host --stage
        <你的 stage 路径>`。
      failed: "打开仪表盘不可用：{detail}"
  status:
    hostPaused: 状态：开关是开的，但本机 host 够不着，回溯已自动暂停（欠账一条没动）
    on: 状态：开关是开的
    off: 状态：开关是关的（这是默认值，需要你手动打开）
  running:
    noStore: 运行：未在运行 —— 浏览器存储不可用。
    disabled: 运行：未在运行 —— 开关没有打开。
    hostPaused: >-
      运行：未在运行 —— 本机 host 够不着，已经暂停；欠账原封不动地留着，下一次
      心跳会先问一次主机在不在，答话了就从同一笔接着做。
    noTargets: >-
      运行：未在运行 —— 开关已经打开了，但还没有任何回溯目标，所以闹钟每次醒来
      都无事可做，一条也没有在取。下面那一行写了你要做的那一件事。
    noHttpPort: >-
      运行：未在运行 —— 开关已经打开了，但此刻没有可用的取数通道，一条也没有
      在取。
    active: >-
      运行：正在归档 —— 大约每 {minMinutes} 到 {maxMinutes} 分钟自动清 1 笔账，
      间隔刻意不固定（不是固定周期）；每天最多 {maxPerDay} 笔，每笔之间至少隔
      {minIntervalSeconds} 秒。
  missing:
    noStore: >-
      缺：browser.storage.local。没有持久化就没有可断可续，与其每次重启都从头
      爬一遍，不如不跑。
    noHttpPort: >-
      缺：一个开着的、已登录的受支持平台页面 —— 取数通道要借它才能建立。历史
      对话只在你自己的浏览器页面里取（同源请求，用的是你本来就有的登录态），
      所以只要没有任何受支持平台的标签页开着，这条腿就取不到数。打开其中任意
      一个平台的页面并保持开着，它就会自己继续。
    noTargets:
      buttonHint: |-
        你现在也可以直接按这段话下面那个「{button}」按钮 ——
        那等于你明确说了「就补这个平台」，我们才会把它记成回溯目标。（我们仍然不猜你的账号：那份归档范围会记成 default，等你真的被归档过一次之后，那个真实账号会另记一份。）
      body: |-
        缺：一次真的被归档过的对话 —— 回溯要从它身上才知道该补哪个平台、哪个账号的历史。
        你现在要做的一件事：在这个平台上发一条消息，或者打开一条你已有的对话，让它被【实时归档】一次（照常交给你本机的 chat-stasher）。捕获到那一次之后，我们才会记下这个平台和这个账号，回溯就从那个账号开始往回补。
        🔴 为什么非得先有这一次：我们不猜你的账号，只用你真的用过的那一个。这个扩展没有任何 host 权限，历史只在你自己已经打开、已经登录的页面里取；在你真的用过一次之前，我们既不会去猜一个账号，也不会把整个平台的会话都翻一遍。
        （补完要多久取决于你自己有多少历史、页面开着多久 —— 这里不给时间承诺，进度会一笔一笔显示在下面。）
    hostPaused: >-
      缺：本机那个 chat-stasher host 答不上话。它由 `chat-stasher
      install-native-host --stage <你的 stage 路径>` 装好并指向一个存在的目录；
      装好之后这条腿会自己恢复（心跳会先问一次主机在不在），不需要你手动点任何
      东西。
  failures:
    head: "🔴 失败：有 {count} 条历史对话取到了正文、但【没有存下来】，而且【不会自动再试】。"
    headDropped: "🔴 失败：有 {count} 条历史对话取到了正文、但【没有存下来】，而且【不会自动再试】。（清单最多留 {max} 条，另有更早的 {dropped} 条已经不在清单里。）"
  failureNote:
    title: "这几条没有存下来（按时间从新到旧）："
    row: "· {platform} · 会话 {shortId}… · {reason} · {at}"
    retry: >-
      🔴 它们不会被自动重试 —— 这是刻意的：同一个出口刚刚已经失败过一次，
      闷头再试一遍只会把同一个失败重复一遍，还会让你以为它已经好了。
    ledger: >-
      欠账账本上它们既不算「已归档」也不再排队，所以进度里的数字没有把它们
      冒充成成功。
    clear: 清空这份清单只是「我知道了」，不会触发任何重新抓取。
  lastTick:
    none: >-
      闹钟：存储里还没有任何一次闹钟跳动的记录 —— 可能它还没醒过第一次。
      （这一条是照实说「我不知道」，不是「它没在跑」。）
    ran: >-
      闹钟：最近一次醒来是 {when}，那一跳真的跑了（登记表里有 {targets} 个
      回溯目标）。
    skipped: >-
      闹钟：最近一次醒来是 {when}，那一跳【什么都没做】——{reason}
      （当时登记表里有 {targets} 个回溯目标）。
    # 🔴 W36b · 【跑了】不等于【跑出结果】。第一次真机验收读到的就是
    # 「ran: true」配上一个纹丝未动的存储布局；这一行补上缺的那一半 ——
    # 这一跳自己的停止原因，以前在写进存储之前就被丢掉了。
    halted: >-
      而且那一跳并没有跑完就停住了：{reason}。技术细节：{detail}
    ledgerMismatch: >-
      而且那一跳【拒绝取任何东西】：这个平台的进度记录里列着的对话，欠账存储里
      已经一条都没有了，没有欠账集合可以往下清。没有任何一笔被销账，这条腿也试着
      把这个范围重置成从头重新列一遍 —— 下面这段细节写了它记下了什么、以及有没有
      成功。技术细节：{detail}
  progress:
    notStarted: >-
      进度：还没有开始 —— 存储里还没有这个平台的欠账集合，也就是说一条都还没有
      枚举过。
    line: "进度：{progress}"
  coverage:
    all: "回溯覆盖：目前支持的平台（{yes}）都能补历史对话。"
    partial: >-
      回溯覆盖：现在只有 {yes} 能补回历史对话；{no} 【还不能】。它们的实时归档
      照常工作（你正在看的那条对话仍然会被存下来），只是过去的历史暂时补不回来
      —— 这不是坏了，也不是你没有历史，是我们还没学会读它们的历史列表。
    noteTitle: 这些平台暂时补不回历史，各自卡在哪一步：
    noteWhy: >-
      🔴 我们不会为了让它「看起来在动」而去猜一个接口地址：猜错的结果不是报错，
      而是你以为历史在补、实际上一条都没补。宁可在这里明说还不支持。
  notes:
    target: "这份进度对应：平台 {platform} · 归档范围 {scope}"
    noTarget: 还没有任何平台的回溯记录，所以这里没有可显示的归档范围。
    # 🔴 W36b · 存储里发现的 W18 之前的旧布局，就地说清楚。
    # 下面两句【不是】同一句话，差别正是要点：moved 是已经修好的事实，
    # refused 是旧记录还攥着你的 id、而这条腿不会去动它。
    legacy:
      moved: >-
        存储布局：这一页在显示任何东西之前，先把 {count} 条更早（W18 之前）的
        回溯记录搬到了当前布局，所以上面显示的是它现在的样子。什么都不会丢：
        旧记录只有在内容写入并读回校验之后才会被删除。
      refused: >-
        存储布局：发现了 {found} 条更早（W18 之前）的回溯记录，其中只搬动了
        {moved} 条。剩下的还原样留在存储里，这条腿不会拿它们去跑 —— 里面的 id
        是你的，不会被丢掉。原因：{reason}。技术细节：{detail}
    whatOpening: >-
      打开之后会做什么：只要有一个受支持平台的页面开着，就在后台悄悄补历史对话，
      间隔刻意不固定，大约每 {minMinutes} 到 {maxMinutes} 分钟一笔，用的是你
      自己那个页面的登录态；每天最多 {maxPerDay} 笔，好几天里慢慢补完。关掉即停
      （定时器也会一并清掉）。
    relisted: >-
      这个平台的历史回溯：{when} 发现它的进度记录里列着 {recorded} 条对话 id，
      而存储里的欠账集合只剩 {held} 条。已经补过哪些的记录无法恢复，所以对话列表
      是从头重新列了一遍，这些对话会再走一遍。你的归档里没有被删掉任何东西。
    halted:
      unsupportedPlatform: >-
        这个平台（{platform}）的历史回溯还没有实现，所以这条腿在发出任何请求
        之前就停住了。这不是平台改版，也不是被限流。技术细节：{detail}
      detailUnsupported: >-
        这个平台（{platform}）的历史会话【已经列出来了】（{pending} 条在等着），
        但取每条对话正文的那一步还没有实现，所以这条腿在取第一条正文之前就停住
        了，目前一条也没有存下来。这不是平台改版，也不是被限流；列出来的这些会
        一直留着，等那一步补上就接着往下清。技术细节：{detail}
      orgAmbiguous: >-
        这个 Claude 账号同时属于好几个组织，页面上也没有任何信息能说明该回溯哪一个
        —— 所以这条腿在发出任何请求之前就停住了。请在你想要归档的那个组织里打开一次
        对话，它就会认准那一个。
      orgUnresolved: >-
        这条腿在发出任何请求之前就停住了：它没法确定这个账号正在用的是哪个 Claude
        组织。打开一次 Claude 对话，它就能找到你的组织。
      waitingRetry: >-
        这条腿【没有停下】，也没有销掉任何一笔账：平台拒绝或掐断了这次请求
        （{reason}），所以它在等自己的退避时间过去，之后会自己接着往下走 ——
        还是从原来那个位置，大约 {minutes} 分钟后。这是这一串连续失败的第
        {attempts} 次；如果这个数字一直往上涨，那就说明平台是真的不高兴，而不是
        一时够不着。技术细节：{detail}
      other: "这条腿已经停下并留痕：{reason} —— {detail}"

tick:
  reason:
    noTargets: 还没有任何回溯目标，不知道该补哪个平台、哪个账号的历史
    noHttpPort: 没有可用的取数通道（当时没有一个开着的受支持平台页面）
    disabled: 开关当时是关的
    noStore: 浏览器存储当时不可用
    hostPaused: 本机 host 够不着，这条腿在等到它答话之前暂停了
    alreadyRunning: 上一跳还没结束，这一跳直接让路了
    ran: 它跑了
    unknown: "结局码：{reason}"

progress:
  haltedPrefix: "[已停止：{reason}] "
  retryPrefix: "[等待重试：{reason}（第 {attempts} 次，约 {minutes} 分钟后）] "
  unknownTotal: "已归档 {archived} 条，欠账 {pending} 条，总数未知（{reason}）"
  withTotal: "已归档 {archived} / 共 {total} 条（{percent}%），欠账 {pending} 条"
  withContradictedTotal: >-
    已归档 {archived} 条，欠账 {pending} 条 —— 目前至少已列出 {listed} 条；
    接口自报的 total 已经被实际返回的行数超过，所以不用它当分母
  reason:
    noTotalFromApi: 接口未提供 total
    totalNotPositiveInt: total 不是可用的正整数
    totalExpired: 已归档数超过 total，分母已过期
    totalContradicted: 接口自报的 total 已经被实际列出数超过

failure:
  notSaved: 取到了正文，但没有写出任何文件
  identityMismatch: 写出去了，但用的文件名身份和这条欠账对不上
  detailPagedUnsupported: >-
    这条会话只回来了一部分——平台那边还有，我们不取剩下的——所以什么都没有存
  detailTooLong: >-
    这条会话比我们一次取的部分多，所以什么都没有存
  detailTreeIncomplete: >-
    这条会话只取回了一部分——从最新一条往回追，追到一条这次回复里没有的消息——所以什么都没有存
  unknownReason: "理由码 {reason}"
  shortIdEmpty: "（空）"

platformNote:
  perplexity:
    partial: >-
      Perplexity：还不能回溯历史正文。已经能列出你的历史会话了，但还不会去取每条
      会话的内容，所以暂时一条也不会存下来。
