[workspace]
members = ["crates/*"]
resolver = "2"

[patch.crates-io]
rustic_core = { path = "vendor/rustic_core" }

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/dimpurr/chat-stasher"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
