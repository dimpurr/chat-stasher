[package]
name = "chat-stasher"
version = "0.5.0"
edition.workspace = true
description = "Append-only archive for every LLM conversation, across harnesses."
license = "Apache-2.0"
repository = "https://github.com/dimpurr/chat-stasher"
homepage = "https://chatstasher.com"
documentation = "https://docs.rs/chat-stasher"
keywords = ["llm", "archive", "conversation", "harness", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"
# Tests are deliberately not packaged: `nativehost_e2e_test.rs:36` reads
# `../../contracts/`, which lies outside the package root and cannot ship, so
# `cargo test` inside a published crate would fail rather than pass. Everything
# a source build needs (`src`, the embedded `data` registry, the lock and the
# readme) is present.
#
# `examples/` is packaged because cargo autodiscovers it: an example missing
# from the archive while `Cargo.toml` still names its file makes the
# `cargo publish` verification build fail on "file not found for example", so
# excluding it here would only defer the failure to release time.
include = ["/src/**", "/data/**", "/examples/**", "/Cargo.toml", "/Cargo.lock", "/README.md"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# BackupStore (spike B4): pinned to the versions proven by the A-series spikes
# (rustic_check crate in scratch/spike used exactly these).
rustic_core = { version = "=0.12.0" }
rustic_backend = { version = "=0.6.2", default-features = false, features = ["opendal"] }
anyhow = "1"
serde_json = "1"
sha2 = "0.11"
zstd = "0.13"
rayon = "1"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
# Appended rather than inserted: `docs-dev/threat-model.md` cites this table by
# line (`Cargo.toml:26-27,33`) to name the pinned crates, and inserting in the
# middle would move those lines onto whatever was written here — turning a
# still-correct sentence into a wrong one without anybody editing it.
#
# `install-native-host --stage` has to add one key to a hand-written, heavily
# commented config file. `toml` (a serde round-trip) would re-emit the file and
# delete every comment the user wrote; `toml_edit` is the format-preserving
# editor that keeps them. It is already in the lock file as `toml`'s own
# parser, so this adds no new crate to the build graph — only a direct edge.
toml_edit = "0.22"
# `--day` / `--since` / `--until` are *local calendar days*, and std has no
# timezone at all — no offset, no DST rule, nothing. Resolving "the local day
# 2026-01-15" to a unix interval without a tz database would mean guessing the
# offset, which is the same class of lie as recording an unknown as zero.
#
# `chrono` is already in this workspace's lock file (via `serde_with`), and
# `iana-time-zone` — the crate `clock` needs to find the local zone — is in
# there with it, so this adds no new package to the build graph. Same reasoning
# as the `toml_edit` note above; appended for the same citation-stability
# reason.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# The body cache sits *below* `rustic_core`, as a wrapper over its backend
# trait, and that trait's read methods are typed in `bytes::Bytes`
# (`ReadBackend::read_partial`). Naming the type in an `impl` requires a direct
# edge to the crate that defines it. It is already in the lock file and the
# build graph as `rustic_core`'s own dependency, so this adds no package —
# only a direct edge. Appended for the same citation-stability reason as the
# notes above.
bytes = "1"
tempfile = "3"
# `src/packcheck.rs` reads a pack's own header: the entry list in it is
# `rustic_core`'s `HeaderEntry`, parsed with the `binrw` reader that type derives
# (rustic's own `PackHeader::from_binary` is `pub(crate)`), and the AEAD call it
# cannot borrow is the crate `rustic_core` encrypts with — its 64-byte key layout
# is rustic's own, and this is the cipher, at the version the pinned rustic
# depends on. Both are already in the lock file as that crate's dependencies, so
# they add no package to the build graph — only the direct edges. Appended, not
# inserted, for the same citation-stability reason as the entries above.
binrw = "0.15"
aes256ctr_poly1305aes = "0.2.1"
jsonschema = { version = "0.58.5", default-features = false }
base64 = "0.22.1"
# `src/install_provenance.rs` asks one bounded question of a shard's bytes —
# "does this file contain this install id at all?" — before deciding whether to
# parse it. That is a substring search over ~12 GB on this machine's stage, and
# the naive form of it (`slice::windows`, O(n·m)) is minutes rather than
# seconds; `memmem` is the SIMD search that makes it a single pass. It is
# already in the lock file as `serde_json`'s own dependency, so this adds no
# package to the build graph — only a direct edge. Appended, not inserted, for
# the same citation-stability reason as the entries above.
memchr = "2"

[dev-dependencies]
# The protocol tests have to compute the SHA-256 the extension would send, from
# outside the crate: a test that reused an internal helper would be asserting
# the implementation against itself. Same version as the normal dependency, so
# this adds no new package to the build graph.
sha2 = "0.11"
# The stage tests assert that the config records the path *as TOML spells it*.
# Rust's `{:?}` is a different spelling that coincides with TOML's on every
# Unix path and on no Windows one, so building the expectation with it is what
# let this file pass on macOS and Linux while failing on Windows.
# Same version as the normal dependency, so this adds no new package to the
# build graph.
toml = "0.8"
# `search_cache_windows_shape_test` compares the cache root chat-stasher walks
# (`store::rustic_cache_roots`, from `scanner::user_cache_dirs_on`) with the one
# rustic itself resolves (`rustic_core`'s vendored `Cache::new` calls
# `dirs::cache_dir()`). Asking rustic for it would mean opening a repository,
# which is exactly what the test must not do outside a temp directory (W289), so
# the test calls the same `dirs` instead. Same version `rustic_core` pins, so
# this adds no new package to the build graph — only the direct dev edge.
dirs = "6"
# `tests/nativehost_e2e_test.rs` holds the coordination state database's
# write transaction open from outside the host process, to model what the
# first request of a cold install-provenance fill holds across its seal
# (W930): the timeout re-send arrives behind exactly that transaction, and
# the test has to hold it from the other side of the process boundary the
# e2e suite exists to keep. Same pinned version and feature set as the
# normal dependency, so this adds no new package to the build graph —
# only the direct dev edge.
rusqlite = { version = "=0.32.1", features = ["bundled"] }
# `tests/setup_interactive_test.rs` drives the setup wizard through the real
# interactive path, which demands a terminal (`is_terminal()` on both stdin
# and stdout) — a pipe is not one on any platform, so the suite allocates a
# pseudo-terminal with `posix_openpt`. std has no pty API, hence this crate.
# Held to `cfg(unix)`: the Windows counterpart is ConPTY, which this repo has
# no bindings for, and the test states that gap in its own file rather than
# compiling a driver it cannot drive. Already in this workspace's lock file as
# a normal dependency of several crates, so adding it here adds no new package
# to the build graph — only the direct edge.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[profile.release]
lto = true

[profile.test]
# keep test builds quiet unless a test fails

# `cargo binstall chat-stasher` pulls the release binary directly instead of
# compiling. The asset names are the release asset contract (release.yml, the
# build jobs' "Stage" steps): the bare, versionless
# `chat-stasher-darwin-arm64` and so on. `pkg-fmt = "bin"` says the download
# *is* the binary, so no `bin-dir` is needed. The default `{ target }` would
# interpolate the Rust triple (`aarch64-apple-darwin`), which matches none of
# the assets, hence the per-target overrides. A target with no override falls
# back to binstall's other strategies, which is what happens on any platform
# this project ships no binary for.
#
# One override per target the release builds for, because the two vocabularies
# are unrelated: the keys on the left are Rust triples and the URLs on the
# right are the asset names this project publishes.
[package.metadata.binstall]
pkg-fmt = "bin"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/chat-stasher-darwin-arm64"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/chat-stasher-darwin-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/chat-stasher-linux-arm64"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/chat-stasher-linux-x86_64"

# The Windows asset carries its `.exe`, because that is the name a Windows user
# who downloads it from the Releases page needs. binstall fetches whatever the
# URL names, so the override names it exactly as it is published.
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/chat-stasher-windows-x86_64.exe"

# RI-5 optional inbox transport and producer encryption; no archive key on send.
[dependencies.age]
version = "0.11.1"
default-features = false
[dependencies.ed25519-dalek]
version = "2.2.0"
[dependencies.opendal]
version = "=0.57.0"
default-features = false
features = ["blocking", "services-memory", "services-fs"]
[dependencies.tokio]
version = "1"
features = ["rt-multi-thread"]
