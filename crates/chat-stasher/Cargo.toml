[package]
name = "chat-stasher"
version = "0.5.0-dev"
edition.workspace = true
description = "Append-only archive for every LLM conversation, across harnesses."
license = "Apache-2.0"
repository = "https://github.com/dimpurr/chat-stasher"
homepage = "https://chatstasher.com"
documentation = "https://docs.rs/chat-stasher"
keywords = ["llm", "archive", "conversation", "harness", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"
# Tests are deliberately not packaged: `nativehost_e2e_test.rs:36` reads
# `../../contracts/`, which lies outside the package root and cannot ship, so
# `cargo test` inside a published crate would fail rather than pass. Everything
# a source build needs (`src`, the embedded `data` registry, the lock and the
# readme) is present.
include = ["/src/**", "/data/**", "/Cargo.toml", "/Cargo.lock", "/README.md"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# BackupStore (spike B4): pinned to the versions proven by the A-series spikes
# (rustic_check crate in scratch/spike used exactly these).
rustic_core = { version = "=0.12.0" }
rustic_backend = { version = "=0.6.2", default-features = false, features = ["opendal"] }
anyhow = "1"
serde_json = "1"
sha2 = "0.11"
zstd = "0.13"
rayon = "1"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
# Appended rather than inserted: `docs/threat-model.md` cites this table by
# line (`Cargo.toml:26-27,33`) to name the pinned crates, and inserting in the
# middle would move those lines onto whatever was written here — turning a
# still-correct sentence into a wrong one without anybody editing it.
#
# `install-native-host --stage` has to add one key to a hand-written, heavily
# commented config file. `toml` (a serde round-trip) would re-emit the file and
# delete every comment the user wrote; `toml_edit` is the format-preserving
# editor that keeps them. It is already in the lock file as `toml`'s own
# parser, so this adds no new crate to the build graph — only a direct edge.
toml_edit = "0.22"
# `--day` / `--since` / `--until` are *local calendar days*, and std has no
# timezone at all — no offset, no DST rule, nothing. Resolving "the local day
# 2026-01-15" to a unix interval without a tz database would mean guessing the
# offset, which is the same class of lie as recording an unknown as zero.
#
# `chrono` is already in this workspace's lock file (via `serde_with`), and
# `iana-time-zone` — the crate `clock` needs to find the local zone — is in
# there with it, so this adds no new package to the build graph. Same reasoning
# as the `toml_edit` note above; appended for the same citation-stability
# reason.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# The body cache sits *below* `rustic_core`, as a wrapper over its backend
# trait, and that trait's read methods are typed in `bytes::Bytes`
# (`ReadBackend::read_partial`). Naming the type in an `impl` requires a direct
# edge to the crate that defines it. It is already in the lock file and the
# build graph as `rustic_core`'s own dependency, so this adds no package —
# only a direct edge. Appended for the same citation-stability reason as the
# notes above.
bytes = "1"
tempfile = "3"

[dev-dependencies]
# The protocol tests have to compute the SHA-256 the extension would send, from
# outside the crate: a test that reused an internal helper would be asserting
# the implementation against itself. Same version as the normal dependency, so
# this adds no package to the build graph.
sha2 = "0.11"
# The stage tests assert that the config records the path *as TOML spells it*.
# Rust's `{:?}` is a different spelling that coincides with TOML's on every
# Unix path and on no Windows one, so building the expectation with it is what
# let this file pass on macOS and Linux while failing on Windows.
# Same version as the normal dependency, so this adds no package to the build
# graph.
toml = "0.8"

[profile.release]
lto = true

[profile.test]
# keep test builds quiet unless a test fails

# `cargo binstall chat-stasher` pulls the release binary directly instead of
# compiling. The asset names are the install.sh contract (release.yml "Stage
# artifacts"): the bare, versionless `chat-stasher-darwin-arm64` and
# `chat-stasher-darwin-x86_64`. `pkg-fmt = "bin"` says the download *is* the
# binary, so no `bin-dir` is needed. The default `{ target }` would interpolate
# the Rust triple (`aarch64-apple-darwin`), which matches none of the assets,
# hence the per-target overrides. Targets with no override (everything but
# macOS) fall back to binstall's other strategies.
[package.metadata.binstall]
pkg-fmt = "bin"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/chat-stasher-darwin-arm64"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/chat-stasher-darwin-x86_64"
